<title>遗传学多功能计算器</title>
<style>

*{box-sizing:border-box}

table.rtab th,table.rtab td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}

.kv{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.big{font-size:16px;font-weight:700}
.center{text-align:center}

<header>
  <div class="title"><svg class="logoSvg" viewBox="0 0 64 64" width="26" height="26" style="flex:0 0 26px"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6ef7"/><stop offset="1" stop-color="#9333ea"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg)"/><g stroke-width="4" stroke-linecap="round" fill="none"><path d="M20 10 C20 24 44 24 44 38" stroke="#22d3ee"/><path d="M44 10 C44 24 20 24 20 38" stroke="#f472b6"/><path d="M20 26 C20 38 44 38 44 54" stroke="#22d3ee"/><path d="M44 26 C44 38 20 38 20 54" stroke="#f472b6"/></g><g stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><line x1="21" y1="17" x2="43" y2="17"/><line x1="21" y1="32" x2="43" y2="32"/><line x1="21" y1="47" x2="43" y2="47"/></g></svg>遗传学多功能计算器 <span style="font-size:11px;color:var(--muted);font-weight:400">复等位 · 连锁 · 致死 · 互作 · 伴性 · 细胞质 · 反推</span></div>

<script>



/* ================= 工具函数 ================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function lcm(a,b){return a/gcd(a,b)*b}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d}const g=gcd(Math.round(n),Math.round(d));return{n:Math.round(n)/g,d:Math.round(d)/g}}
const rAdd=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d);
const rSub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d);
const rMul=(a,b)=>R(a.n*b.n,a.d*b.d);
const rZero=R(0),rOne=R(1);
const rNum=a=>a.n/a.d;
const rIs0=a=>a.n===0;
const rEq=(a,b)=>a.n===b.n&&a.d===b.d;
function rStr(a){return a.d===1?String(a.n):a.n+'/'+a.d}
function rPct(a){const v=rNum(a)*100;return (Math.round(v*1000)/1000)+'%'}
/* 通用数值解析：支持 整数、小数、分数(a/b) 三种写法，返回精确分数；非法返回 null。
   例：'20'→20，'12.5'→25/2，'1/7'→1/7，'0.5/2'→1/4 */
function parseNumFrac(x){
  if(x==null)return null;
  const t=String(x).trim().replace(/[（）()\s]/g,'');
  if(!t)return null;
  if(t.includes('/')){
    const fm=/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/.exec(t);
    if(!fm)return null;
    let a=parseFloat(fm[1]),b=parseFloat(fm[2]);
    if(!isFinite(a)||!isFinite(b)||b===0)return null;
    let k=1;
    while((a%1!==0||b%1!==0)&&k<1e6){a*=10;b*=10;k*=10}
    return R(Math.round(a),Math.round(b));
  }
  if(!/^\d+(?:\.\d+)?$/.test(t))return null;
  const v=parseFloat(t);
  if(!isFinite(v))return null;
  if(v%1===0)return R(v,1);
  let w=v,k2=1;
  while(w%1!==0&&k2<1e6){w*=10;k2*=10}
  return R(Math.round(w),Math.round(k2));
}

function pctIn(v){/* 输入概率/百分比：'20'或'20%'=20%；'12.5'=12.5%；'1/7'=1/7（分数直接作为比例） */
  if(v==null||v==='')return R(0);
  const t=String(v).trim().replace(/%$/,'');
  if(t.includes('/')){const fr=parseNumFrac(t);if(fr)return fr}
  const x=Number(t)||0;return R(Math.round(x*1000),100000)}
function ratioStr(rs){
  if(!rs.length)return'';
  /* 分母 lcm 可能迅速膨胀（如 1/4、1/8、1/16… 多代组合），超阈值就退化为逐项分数显示，避免卡死 */
  let L=1,overflow=false;
  for(const r of rs){L=lcm(L,r.d);if(L>1e9){overflow=true;break}}
  if(!overflow){
    const ns=rs.map(r=>r.n*L/r.d);
    if(ns.every(Number.isInteger)){
      const g=ns.reduce((a,b)=>gcd(a,b));
      const m=ns.map(n=>n/g);
      if(m.every(x=>x>0)&&Math.max(...m)<=2000000)return m.join(' : ');
    }
  }
  return rs.map(rStr).join(' : ');
}
/* 比例字符串缓存：图解里同一比例会被反复渲染 */
const RATIO_CACHE=new Map();
function ratioOf(sum){
  const key=sum.map(e=>{const p=(e.pn!=null?e.pn:e.p);return p.n+'/'+p.d}).join(',');
  const hit=RATIO_CACHE.get(key);
  if(hit!=null)return hit;
  const s=ratioStr(sum.map(e=>(e.pn!=null?e.pn:e.p)));
  if(RATIO_CACHE.size<2000)RATIO_CACHE.set(key,s);
  return s;
}
function el(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined)e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){const kid=arguments[i];if(kid==null)continue;e.append(kid.nodeType?kid:document.createTextNode(kid))}
  return e;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function sup(s){/* 把 IA 显示为 I<sup>A</sup>：末位小写字母转上标 */
  return esc(s);
}
/* ================= 全局状态 ================= */
function chromDef(){return{pairs:2,ploidy:{},placed:[],rec:{},triMode:'indep',nullG:'dead'}}
/* ===== 性能：计算缓存 =====
   多代迭代时同一基因型会被反复处理（自交到后期群体基因型高度重复），
   配子表与"群体→下一代"结果对同一输入完全相同，故按内容做记忆化。

function rebuildLoci(){
  LOC=[];
  S.simple.length=Math.max(0,S.simpleCount|0);
  for(let i=0;i<S.simpleCount;i++)if(!S.simple[i])S.simple[i]=defSimple(i);
  S.simple.forEach((L,i)=>LOC.push({id:'n'+i,group:'simple',idx:i,letter:L.letter||LETTERS[i]||'G',def:L}));
  S.multi.length=Math.max(0,S.multiCount|0);
  for(let i=0;i<S.multiCount;i++)if(!S.multi[i])S.multi[i]=defMulti(i);
  S.multi.forEach((L,i)=>LOC.push({id:'m'+i,group:'multi',idx:i,letter:L.letter||'I',def:L}));
  S.cyto.length=Math.max(0,S.cytoCount|0);
  for(let i=0;i<S.cytoCount;i++)if(!S.cyto[i])S.cyto[i]=defCyto(i);
  S.cyto.forEach((L,i)=>LOC.push({id:'c'+i,group:'cyto',idx:i,letter:L.letter||'L',def:L}));
  /* 默认规则：各栏目染色体对数 = 该栏目基因（座）数（每对基因一对染色体，独立遗传）；
     用户手动修改过对数后（pairsAuto=false）则尊重其设置 */
  ['simple','multi','cyto'].forEach(g=>{
    const ch=S.chrom[g];
    const n=LOC.filter(l=>l.group===g&&!(l.group==='simple'&&l.def.inherit!=='auto')).length;
    /* 默认：每对基因占一对染色体（即自由组合）；用户手动改过对数则以用户设置为准 */
    if(ch.pairsAuto!==false)ch.pairs=Math.max(1,n);
  });
  /* 反推基因的染色体位置表：长度随基因数增减（默认每个基因一对染色体） */
  if(S.rev){
    const nG=((S.rev.genes||[]).length+revNGen());
    const ch=S.rev.chrom||(S.rev.chrom=[]);
    for(let i=0;i<nG;i++)if(!ch[i])ch[i]={pair:i,col:0};
    ch.length=nG;
  }
}

function alleleSyms(l){ // 某基因座全部可选等位基因符号（multi 按等级框顺序展平：高显性在前）
  if(l.group==='simple'){if(REV_MODE)return revAlleleSyms(l);const c=l.def.letter||'A';return[c,c.toLowerCase()]}
  if(l.group==='multi'){normMulti(l.def);return[].concat(...l.def.tiers.map(t=>t.alleles.map(a=>a.sym)))}

  if(l.group==='multi'){normMulti(l.def);const t=l.def.tiers.find(t=>t.alleles.some(a=>a.sym===sym));const a=t&&t.alleles.find(a=>a.sym===sym);return a?a.trait:sym}

  return null;
}

  b.append(flRow('细胞质遗传基因数',numIn(S.cytoCount,0,5,v=>{S.cytoCount=v;S.mating.p1=S.mating.p2=null;softRefresh();refreshPanel('细胞质遗传');refreshPanel('连锁关系')}),
    el('span',{class:'hint'},'随卵细胞质传递')));
  b.append(el('div',{class:'hint',html:'细胞质基因表现为<b>母系遗传</b>：子代细胞质(及表型)完全由母本决定，正反交结果不同，不遵循孟德尔分离。'}));
  S.cyto.forEach((L,i)=>{
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'chead'},'细胞质基因 '+(i+1)));
    card.append(flRow('基因符号',symIn(L.letter,v=>L.letter=(v||'L').slice(0,1).toUpperCase())));
    L.variants.forEach((v,j)=>{
      const row=el('div',{class:'row'});
      row.append(el('span',{class:'badge'},'变体'+(j+1)));
      row.append(el('span',{class:'hint'},'符号'));
      row.append(symIn(v.sym,x=>{const nv=x||('V'+(j+1));if(nv!==v.sym){migrateAlleleSym('cyto',i,v.sym,nv);v.sym=nv}}));
      row.append(el('span',{class:'hint'},'性状'));
      const t=txtIn(v.trait,x=>v.trait=x);t.style.width='130px';
      row.append(t);
      row.append(el('button',{class:'btn mini danger',onclick:()=>{if(L.variants.length>1){L.variants.splice(j,1);renderConfig()}}},'删'));
      card.append(row);
    });
    card.append(el('button',{class:'addbtn',onclick:()=>{L.variants.push({sym:'V'+(L.variants.length+1),trait:'性状'+(L.variants.length+1)});renderConfig()}},'+ 增加变体'));
    b.append(card);
  });
  return b;
}
/* 致死条件编辑（配子/合子共用） */
function condRowEditor(rule,scope,rerender){
  const box=el('div');
  function draw(){
    box.innerHTML='';
    if(!LOC.length){box.append(el('div',{class:'warn'},'请先在上方设置基因，再添加致死条件。'));return}
    rule.conds.forEach((c,k)=>{
      let l=locusById(c.locus);
      if(!l){l=LOC[0];c.locus=l.id}
      if(!alleleSyms(l).includes(c.allele))c.allele=alleleSyms(l)[0];
      const row=el('div',{class:'row'});
      row.append(el('span',{class:'badge'},'条件'+(k+1)));
      row.append(selIn(c.locus,LOC.map(x=>[x.id,(x.group==='simple'?x.letter:x.def.letter)+'('+(x.group==='simple'?'核':x.group==='multi'?'复等位':'细胞质')+')']),
        v=>{c.locus=v;c.allele=alleleSyms(locusById(v))[0];draw()}));
      row.append(selIn(c.allele,alleleSyms(l).map(s=>[s,s]),v=>c.allele=v));
      const types=scope==='gamete'?[['has','含有'],['nothas','不含']]:[['has','含有'],['nothas','不含'],['hom','纯合(该等位)'],['het','杂合']];
      row.append(selIn(c.type,types,v=>c.type=v));
      row.append(el('button',{class:'btn mini danger',onclick:()=>{rule.conds.splice(k,1);draw()}},'删'));
      box.append(row);
    });
    box.append(el('button',{class:'addbtn',onclick:()=>{rule.conds.push({locus:LOC[0].id,allele:alleleSyms(LOC[0])[0],type:'has'});draw()}},'+ 添加条件'));
  }
  draw();return box;
}

          flRow('雌配子死亡率%（可填分数）',pctInEl(rule.rateF==null?0:rule.rateF,v=>rule.rateF=v))));
      }else{

/* 基因互作 */
const INTER_TYPES=[
  ['complement','互补作用（A_B_ 才表达 → 9:7）'],
  ['recessiveEpi','隐性上位（aa 掩盖 B/b → 9:3:4）'],
  ['dominantEpi','显性上位（A_ 掩盖 B/b → 12:3:1）'],
  ['inhibitor','抑制作用（A_ 抑制 B 表达 → 13:3）'],
  ['duplicate','重叠作用（任一显性即表现 → 15:1）'],
  ['additive','积加作用（A_B_ / A_bb+aaB_ / aabb → 9:6:1）'],
  ['polygenic','累加效应（数量性状，显性基因个数分级 → 1:4:6:4:1）'],
  ['pathway','基因通路（代谢途径 A→B→C 流程编辑，含抑制分支）'],
  ['xInact','促进X固缩（显性使其所在的X优先失活为巴氏小体）'],
  ['custom','自定义表型组合表（手动指定各基因型类的表型）']
];
function interPanel(){return panel('🧩 基因互作',interPanelBody(),true)}
function interPanelBody(){
  const b=el('div');
  const it=S.inter;
  b.append(chkIn(it.enabled,v=>{it.enabled=v;renderConfig()},'启用基因互作'));
  if(!it.enabled)return b;
  b.append(flRow('互作类型',selIn(it.type,INTER_TYPES,v=>{it.type=v;refreshPanel('基因互作')})));
  const sl=simpleLoci();
  if(!sl.length){b.append(el('div',{class:'warn'},'基因互作需要至少一对核遗传二等位基因，请先在上方设置。'));}
  if(['complement','recessiveEpi','dominantEpi','inhibitor','duplicate','additive'].includes(it.type)){
    if(!it.locusA&&sl[0])it.locusA=sl[0].id;
    if(!it.locusB&&sl[1])it.locusB=sl[1]?sl[1].id:sl[0].id;
    b.append(el('div',{class:'grid2'},
      flRow('基因座 甲',selIn(it.locusA,sl.map(l=>[l.id,l.letter]),v=>it.locusA=v)),
      flRow('基因座 乙',selIn(it.locusB,sl.map(l=>[l.id,l.letter]),v=>it.locusB=v))));
    const n={complement:2,recessiveEpi:3,dominantEpi:3,inhibitor:2,duplicate:2,additive:3}[it.type];
    b.append(el('div',{class:'hint',html:{
      complement:'A_B_ → 表型一；其余(有任一隐性纯合) → 表型二。经典比例 <b>9:7</b>',
      recessiveEpi:'A_B_ → 表型一；A_bb → 表型二；aa__(隐性纯合上位) → 表型三。经典比例 <b>9:3:4</b>',
      dominantEpi:'A__ → 表型一(显性上位)；aaB_ → 表型二；aabb → 表型三。经典比例 <b>12:3:1</b>',
      inhibitor:'A_ 存在时抑制 B 基因表达 → A_B_、A_bb、aabb 均为表型一；仅 aaB_ 为表型二。经典比例 <b>13:3</b>',
      duplicate:'只要任一基因存在显性即为表型一，仅双隐性纯合为表型二。经典比例 <b>15:1</b>',
      additive:'A_B_ 为表型一；A_bb 与 aaB_ 合并为表型二；aabb 为表型三。经典比例 <b>9:6:1</b>'
    }[it.type]}));
    for(let i=0;i<n;i++)b.append(flRow('表型'+(i+1)+'名称',txtIn(it.traits[i]||('表型'+(i+1)),v=>it.traits[i]=v)));
  }
  if(it.type==='polygenic'){
    b.append(el('div',{class:'hint',html:'累加效应(多基因/数量性状)：每个显性等位基因累加一份效应，n 对基因共 2n+1 级，呈连续表型（钟形分布）。两对基因 F₂ 比例 <b>1:4:6:4:1</b>，三对为 <b>1:6:15:20:15:6:1</b>。请勾选参与的基因座：'}));
    const row=el('div',{class:'row'});
    sl.forEach(l=>{
      const on=it.addLoci.includes(l.id);
      const c=el('span',{class:'chip'+(on?' sel':'')},l.letter);
      c.onclick=()=>{if(on)it.addLoci=it.addLoci.filter(x=>x!==l.id);else if(it.addLoci.length<6)it.addLoci.push(l.id);renderConfig()};
      row.append(c);
    });
    b.append(row);
    if(!it.addLoci.length)b.append(el('div',{class:'warn'},'请至少勾选一个基因座'));
    b.append(el('div',{class:'mt'},chkIn(it.pgVal,v=>{it.pgVal=v;renderConfig()},'启用<b>连续数值表型</b>（数量性状：表型值 = 基础值 + 显性等位数 × 增量）')));
    if(it.pgVal){
      b.append(el('div',{class:'grid2'},
        flRow('性状名称',txtIn(it.pgName==null?'株高':it.pgName,v=>it.pgName=v)),
        flRow('单位',txtIn(it.pgUnit==null?'cm':it.pgUnit,v=>it.pgUnit=v))));
      b.append(el('div',{class:'grid2'},
        flRow('基础表型值（0 个显性时）',numInF(it.pgBase==null?150:it.pgBase,v=>it.pgBase=v)),

      b.append(el('div',{class:'hint',html:'例：基础 150cm、增量 5cm、3 对基因 → 表型从 150cm 到 180cm 共 7 级连续变化。计算结果页将自动绘制各级频率分布图（正态分布柱状图）。'}));
    }

  if(it.type==='pathway'){
    b.append(el('div',{class:'hint',html:'按代谢途径排布基因：底物经 <b>基因1(酶1)→ 基因2(酶2)→ …</b> 逐步转变。某基因隐性纯合(功能缺失)则途径在该步受阻，表型为该步"受阻表型"。全部通畅则表现为最终产物。可另设一个<b>抑制基因</b>（显性时使某一步失活）。'}));
    const pw=it.pathway;
    if(!pw.steps.length&&sl[0]){pw.steps.push({locus:sl[0].id,blocked:'白色(底物)'});if(sl[1])pw.steps.push({locus:sl[1].id,blocked:''});pw.final='红色色素'}
    pw.steps.forEach((st,k)=>{
      const card=el('div',{class:'card'});
      card.append(el('div',{class:'chead'},'第 '+(k+1)+' 步',

      card.append(el('div',{class:'grid2'},

        flRow('该步受阻时表型',txtIn(st.blocked,v=>st.blocked=v))));
      b.append(card);
    });
    b.append(el('div',{class:'row'},
      el('button',{class:'addbtn',onclick:()=>{pw.steps.push({locus:sl[0]?sl[0].id:'',blocked:''});renderConfig()}},'+ 添加途径步骤'),
      el('span',{class:'hint'},'（步骤顺序即代谢顺序）')));
    b.append(flRow('最终产物表型(全通时)',txtIn(pw.final,v=>pw.final=v)));
    if(sl.length>1){
      b.append(flRow('抑制基因（可选）',selIn(pw.sup||'',[['','（无）']].concat(sl.map(l=>[l.id,l.letter+'（显性时抑制）'])),v=>pw.sup=v)));
      if(pw.sup)b.append(flRow('其抑制第几步',selIn(String(pw.supStep==null?1:pw.supStep),pw.steps.map((x,i)=>[String(i+1),'第'+(i+1)+'步']),v=>pw.supStep=parseInt(v)-1)));
    }
    b.append(el('div',{class:'hint',html:'示例：A_→产生酶1(底物→红)，B_→产生酶2(红→紫)。则 A_bb 为红色，aa__ 为白色，A_B_ 为紫色；若再设 C 为抑制基因抑制第1步，则 C_ 存在时一律表现"受阻表型"。'}));
  }
  if(it.type==='xInact'){
    const xls=simpleLoci().filter(l=>l.def.inherit==='X');
    b.append(el('div',{class:'hint',html:'巴氏小体机制：XX 中<b>必有且仅有一条</b> X 固缩失活（每条各 50% 概率），杂合♀ 表现为嵌合体。<br>选择一个<b>伴 X 基因</b>作为促进因子：其<b>显性</b>存在时，携带它的那条 X 染色体<b>优先</b>固缩为巴氏小体 → 该雌性的表型由另一条 X 上的等位决定（偏向性失活，如 X<sup>A</sup>X<sup>a</sup> 中 A 所在 X 失活 → 表现为隐性）。'}));
    if(!S.sexEnabled||!S.barr)b.append(el('div',{class:'warn'},'需先在「基本设置」中勾选性染色体（XY 型）并开启巴氏小体。'));
    else if(!xls.length)b.append(el('div',{class:'warn'},'请在「核遗传等位基因」中至少把一个基因的传递方式设为"伴 X 染色体"。'));
    else{
      if(!it.locusA||!xls.some(l=>l.id===it.locusA))it.locusA=xls[0].id;
      b.append(flRow('促进X固缩的基因（显性时其所在X优先失活）',selIn(it.locusA,xls.map(l=>[l.id,l.letter+'（'+l.def.dom+' / '+l.def.rec+'）']),v=>it.locusA=v)));
      b.append(flRow('该基因所在X染色体固缩率提升至（%，可填分数如1/2）',numInF(it.xInactRate==null?100:it.xInactRate,v=>{it.xInactRate=v})));
      b.append(el('div',{class:'hint',html:'<b>仅雌性（XX）生效，雄性唯一的 X 不失活</b>。<b>100%</b>=携带显性基因的那条 X 完全优先固缩（杂合♀表型确定为另一条 X 的性状）；<b>P%</b>=该 X 失活概率提升至 P+(100−P)/2 %，其余随机——杂合♀的子代表型按此概率拆分计算（如 60% → 显性所在 X 失活 80%、另一条 20%）；<b>0%</b>=不促进（回到随机失活，杂合♀为嵌合体）。'}));
    }
  }
  if(it.type==='custom'){
    b.append(el('div',{class:'hint',html:'选择 ≤3 对核基因，按各座"显性存在(A_) / 隐性纯合(aa)"的组合手动命名表型，适合任意特殊互作题型。'}));
    const row=el('div',{class:'row'});
    sl.forEach(l=>{
      const on=it.customLoci&&it.customLoci.includes(l.id);
      const c=el('span',{class:'chip'+(on?' sel':'')},l.letter);
      c.onclick=()=>{
        it.customLoci=it.customLoci||[];
        if(on)it.customLoci=it.customLoci.filter(x=>x!==l.id);
        else if(it.customLoci.length<3)it.customLoci.push(l.id);
        renderConfig()};
      row.append(c);

    b.append(row);
    const cl=it.customLoci||[];
    if(cl.length){
      const t=el('table',{class:'rtab'});
      t.append(el('tr',null,...cl.map(id=>el('th',null,locusById(id).letter+'基因型类')),el('th',null,'表型名称')));
      const combos=[];(function rec(i,cur){if(i===cl.length){combos.push(cur.slice());return}rec(i+1,cur.concat(1));rec(i+1,cur.concat(0))})(0,[]);
      combos.forEach(cb=>{
        const key=cl.map((id,i)=>id+'='+(cb[i]?'D':'r')).join(',');

        t.append(tr);
      });
      b.append(t);
    }
  }
  return b;
}

/* 符号/字母输入：输入时即时写状态（不丢焦点），失焦(change)时才刷新界面 */
function symIn(v,cb){const i=txtIn(v,cb);i.onchange=()=>softRefresh();return i}
/* 轻量刷新：只重画右侧亲本/计算/图解，或指定的左侧栏目，避免每次失焦都重建整页造成卡顿 */
function softRefresh(){calcCacheReset();try{renderRun()}catch(e){}try{renderDiagram()}catch(e){}}
let pendingPanel=null,panelTimer=null;
function refreshPanel(title){
  pendingPanel=title;
  if(panelTimer)return;
  panelTimer=setTimeout(()=>{
    panelTimer=null;
    const t=pendingPanel;pendingPanel=null;
    if(!t)return;
    const c=document.getElementById('configPanel');
    const d=[...c.querySelectorAll('details.panel')].find(x=>x.querySelector('summary').textContent.indexOf(t)>=0);
    if(!d)return;
    const open=d.open;
    const nb=buildPanelBody(t);
    if(!nb)return;
    const body=d.querySelector('.body');
    body.innerHTML='';body.append(nb);
    d.open=open;
    PANEL_OPEN[d.querySelector('summary').textContent]=open;
  },120);
}
/* 按栏目名重建该栏目的内容（用于基因字母改名后同步染色体图/亲本选择等） */
function buildPanelBody(title){
  if(title.indexOf('核遗传等位基因')>=0)return simplePanelBody();
  if(title.indexOf('复等位基因')>=0)return multiPanelBody();
  if(title.indexOf('细胞质遗传')>=0)return cytoPanelBody();
  if(title.indexOf('连锁关系')>=0)return linkagePanelBody();
  if(title.indexOf('配子致死')>=0)return lethalPanelBody('g');
  if(title.indexOf('合子致死')>=0)return lethalPanelBody('z');
  if(title.indexOf('基因互作')>=0)return interPanelBody();
  return null;
}
/* 改名迁移：基因字母/等位符号改变时，同步更新所有引用旧符号的地方（染色体图放置、亲本基因型、致死条件），避免新旧名称混淆 */
function migrateAlleleSym(group,idx,oldSym,newSym){
  if(!oldSym||!newSym||oldSym===newSym)return;
  const id=(group==='simple'?'n':group==='multi'?'m':'c')+idx;
  const ch=S.chrom[group];
  if(ch)ch.placed.forEach(pl=>{if(pl.locus===id&&pl.sym===oldSym)pl.sym=newSym});
  [S.mating.p1,S.mating.p2].forEach(p=>{
    if(!p)return;
    if(p.all&&p.all[id])p.all[id]=p.all[id].map(s=>s===oldSym?newSym:s);
    if(p.cyto&&p.cyto[id]===oldSym)p.cyto[id]=newSym;
  });
  [S.gLethal,S.zLethal].forEach(st=>{if(st.rules)st.rules.forEach(r=>{if(r.conds)r.conds.forEach(c=>{if(c.locus===id&&c.allele===oldSym)c.allele=newSym})})});
}
/* ================= 连锁与染色体图编辑器 ================= */
const PAIR_COLORS=['#4f6ef7','#e11d48','#059669','#d97706','#7c3aed','#0891b2'];
function groupLoci(g){return LOC.filter(l=>l.group===g)}

/* 染色体图 —— 基因的"座位"与"相位"由本图决定：
   ① 基因放在第几对染色体 → 决定它与谁连锁、与谁自由组合；
   ② 显性等位与隐性等位分别位于哪一条同源染色体 → 决定相引(AB/ab)或相斥(Ab/aB)。
   为使图上画出的相位与计算所用相位完全一致，未放置的基因会自动挂到空余的染色体对上。 */
function chromGeneLoci(g){return groupLoci(g).filter(l=>!(l.group==='simple'&&l.def.inherit!=='auto'))}
function chromLocusName(l){return l?(l.group==='simple'?l.letter:l.def.letter):'?'}
function chromPlacedAt(ch,p,c,k){return ch.placed.find(pl=>pl.pair===p&&pl.col===c&&pl.slot===k&&pl.col!=null&&pl.sym!=null)}
function chromRecVal(ch,p,k){
  const r=ch.rec&&ch.rec[p];
  if(r==null)return null;
  const v=(typeof r==='object')?r[k]:undefined;
  return(v==null||v==='')?null:v;
}
function chromCompactSlots(ch){
  const seen=new Set();
  ch.placed.slice().sort((a,b)=>a.pair-b.pair||a.col-b.col||a.slot-b.slot).forEach(pl=>{
    const key=pl.pair+'|'+pl.col;
    if(seen.has(key))return;
    pl.slot=0;seen.add(key);
  });
  ch.placed.forEach(pl=>{
    const key=pl.pair+'|'+pl.col;
    const group=ch.placed.filter(x=>x.pair===pl.pair&&x.col===pl.col);
    if(group.length<2)return;
    group.filter(x=>x!==pl&&x.slot===pl.slot).forEach(x=>{x.slot=pl.slot+1});
  });
}
/* 规范染色体图：清理越界/失效放置 → 给每个基因固定一对同源染色体（显性在①、隐性在②）
   → 压缩位点编号（留下相邻的空位供插入）。这样图上画出的结构就是实际计算所用的结构。 */
function normalizeChrom(g){
  const ch=S.chrom&&S.chrom[g];
  if(!ch)return;
  const ls=chromGeneLoci(g);
  ch.pairs=Math.max(1,Math.min(12,ch.pairs|0||1));
  ch.placed=(ch.placed||[]).filter(x=>x&&x.col!=null&&x.sym!=null&&x.pair>=0&&x.pair<ch.pairs&&ls.some(l=>l.id===x.locus));
  ch.ploidy=ch.ploidy||{};
  for(let p=0;p<ch.pairs;p++){
    if(ch.ploidy[p]==null)ch.ploidy[p]=2;
    const m=ch.ploidy[p];
    ch.placed=ch.placed.filter(x=>x.pair!==p||(x.col>=0&&x.col<m));
  }
  const order=[];
  ls.slice().sort((a,b)=>locusSortKey(a.id)<locusSortKey(b.id)?-1:locusSortKey(a.id)>locusSortKey(b.id)?1:0).forEach(l=>{
    const own=ch.placed.filter(x=>x.locus===l.id);
    let p=own.length?own[0].pair:-1;
    /* 已有明确放置（含反推里显式指定"同对即连锁"）→ 尊重它；仅当该对越界、或该基因完全没有放置
       且它所在的对已被别的基因占用时才另找空对。若无视已指定的对，连锁/自由组合的设定就会失效。 */
    if(p<0||p>=ch.pairs){
      p=0;
      while(p<ch.pairs-1&&ch.placed.some(x=>x.pair===p&&x.slot===0&&locusSortKey(x.locus)<locusSortKey(l.id)))p++;
    }
    order.push({l,p:Math.min(p,ch.pairs-1)});
  });
  order.forEach(o=>{
    const syms=alleleSyms(o.l),dom=syms[0],rec=syms.length>1?syms[syms.length-1]:syms[0];
    const m=ch.ploidy[o.p]||2;
    const own=ch.placed.filter(x=>x.locus===o.l.id&&x.pair===o.p);
    const keep=[];
    [0,1].forEach(c=>{
      if(c>=m)return;
      const e=own.find(x=>x.col===c);
      keep.push({locus:o.l.id,pair:o.p,col:c,slot:e?e.slot:null,sym:e?e.sym:(c===0?dom:rec)});
    });
    own.forEach(x=>{if(x.col>1&&x.col<m)keep.push({locus:o.l.id,pair:o.p,col:x.col,slot:x.slot,sym:x.sym})});
    ch.placed=ch.placed.filter(x=>!(x.locus===o.l.id));
    keep.forEach(kp=>{
      if(kp.slot!=null&&kp.slot<16){ch.placed.push(kp);return}
      const used=new Set(ch.placed.filter(x=>x.pair===kp.pair&&x.col===kp.col).map(x=>x.slot));
      let sl=0;while(used.has(sl))sl++;
      kp.slot=sl;ch.placed.push(kp);
    });
  });
  chromCompactSlots(ch);
  ch.rec=ch.rec||{};
}
/* 补齐亲本某基因座的等位基因数组到该位点应有的条数。
   反推为了搜索速度会给"显性纯合"只写一个等位（如 [B]），若不补齐就会算出"缺体配子"，
   导致比例全错（9:3:4 被算成 3:5）。补齐规则：按染色体图上该基因座各列的等位对齐，
   缺的一列取隐性（全隐性纯合）。 */
function padAlleles(parent,l){
  if(!parent.all)parent.all={};
  const arr=parent.all[l.id];
  const m=(l.group==='cyto')?1:ploidyOfLocus(l);
  if(arr&&arr.length===m)return;
  const syms=alleleSyms(l);
  const def=syms.length>1?syms[syms.length-1]:syms[0];
  const ch=S.chrom&&S.chrom[l.group];
  const defByCol={};
  if(ch)(ch.placed||[]).forEach(x=>{if(x.locus===l.id&&defByCol[x.col]==null)defByCol[x.col]=x.sym});
  const src=(arr&&arr.length)?arr:[];
  const out=[];
  const taken=new Set();
  /* 反推里"等位数不足"表示该基因座纯合：其余同源染色体补同一个等位。
     （若按染色体图的显/隐性去补会把 AABB×aabb 变成 AaBb×AaBb，9:3:4 会算成 25:24:15） */
  if(REV_MODE&&src.length&&src.length<m){
    const s0=src[0];
    for(let c=0;c<m;c++)out.push(s0);
    parent.all[l.id]=out;
    return;
  }
  /* 完全缺失（如反推自动追加的"未写出的互补基因"）：按染色体图补齐，全隐性纯合 */
  if(!src.length){
    for(let c=0;c<m;c++)out.push(defByCol[c]!=null?defByCol[c]:def);
    parent.all[l.id]=out;
    return;
  }
  for(let c=0;c<m;c++){
    const want=defByCol[c];
    let idx=-1;
    if(want!=null)idx=src.findIndex((s,i)=>s===want&&!taken.has(i));
    if(idx<0)idx=src.findIndex((s,i)=>!taken.has(i)&&i===c);
    if(idx<0)idx=src.findIndex((s,i)=>!taken.has(i));
    if(idx>=0){taken.add(idx);out.push(src[idx])}
    else out.push(want!=null?want:def);
  }
  parent.all[l.id]=out;
}
/* 点击横线放置：该位点已有字母则替换；该基因已在别处则整体搬移；空位则放入并提示成功 */
function chromHandleSlotClick(g,pair,col,slot){
  const ch=S.chrom[g];
  normalizeChrom(g);
  if(!selectedChip){toast('请先点击上方等位基因标签（如 A 或 a）选中，再点击染色体上的横线');return}
  const sep=selectedChip.indexOf('|');
  if(sep<0){selectedChip=null;toast('请重新选择等位基因标签');return}
  const locusId=selectedChip.slice(0,sep),sym=selectedChip.slice(sep+1);
  const l=locusById(locusId);
  if(!l){toast('该基因已不存在，请重新选择');return}
  const ex=ch.placed.find(pl=>pl.pair===pair&&pl.col===col&&pl.slot===slot);
  if(ex){ex.locus=locusId;ex.sym=sym;normalizeChrom(g);renderConfig();chromPlacedModal(g,pair,col,slot,sym);return}
  const own=ch.placed.filter(pl=>pl.locus===locusId);
  if(own.length){
    const tgt=own.find(pl=>pl.pair===pair)||own[0];
    tgt.pair=pair;tgt.col=col;tgt.slot=slot;
    own.forEach(pl=>{if(pl!==tgt&&pl.pair===pair)ch.placed=ch.placed.filter(x=>x!==pl)});
    normalizeChrom(g);renderConfig();chromPlacedModal(g,pair,col,slot,sym);return;
  }
  ch.placed.push({pair,col,slot,locus:locusId,sym});
  normalizeChrom(g);
  renderConfig();
  chromPlacedModal(g,pair,col,slot,sym);
}

/* 染色体图（细胞视图）：
   · 椭圆＝细胞，竖线＝染色体（彩色区分不同对的同源染色体），短横线＝基因位点；
   · 小圆＝着丝粒，三体等多拷贝染色体明显更长，缺体（0 条）以虚线空位表示；
   · 基因字母统一放在竖线左侧、偏移量很小，不与竖线或横线重叠。 */
function drawChromSVG(g){
  const ch=S.chrom[g];
  const ls=chromGeneLoci(g);
  normalizeChrom(g);
  const slotMax=Math.max(1,ls.length);
  let maxM=2;for(let p=0;p<ch.pairs;p++)maxM=Math.max(maxM,ch.ploidy[p]||2);
  const SP=26;
  const colW=Math.max(124,maxM*SP+56);
  const cellW=Math.max(240,24+ch.pairs*colW);
  const yTop=58,barH=64+slotMax*26;
  const cellH=barH+30;
  const W=cellW,Ht=yTop+cellH+92;
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');

  const yMid=yTop+barH/2;

  svg.append(mk('text',{x:W/2,y:yTop-16,'text-anchor':'middle','font-size':10.5,fill:'currentColor',opacity:.6},'细胞（每条竖线＝一条染色体，短横线＝基因位点；小圆＝着丝粒）'));
  const tabs=el('div',{class:'chromtabs'});
  for(let p=0;p<ch.pairs;p++){
    const m=ch.ploidy[p]||2,color=PAIR_COLORS[p%PAIR_COLORS.length];
    const tab=el('button',{class:'chromtab'+(S.chromFocus===p?' on':''),title:'只显示第'+(p+1)+'对染色体'},'第'+(p+1)+'对 · '+m+'条');
    tab.style.borderColor=color;tab.style.color=color;
    tab.onclick=()=>{S.chromFocus=S.chromFocus===p?null:p;renderConfig()};
    tabs.append(tab);

  for(let p=0;p<ch.pairs;p++){
    const m=ch.ploidy[p]||2;

/* ================= 逐代剔除 / 反推引擎 ================= */
let DOM_FLIP=new Set(); /* 反推时翻转显隐性的基因座集合 */
let REV_PW=null;        /* 图解模式激活时的通路图假设 {genes,inh,reactions,inhibitions,flip}（显性基因名→催化/抑制） */

/* 图解模式表型判定：通路图语义。
   - reactions: {from:节点id,to:节点id,gene:基因字母(大写显性)}——该基因显性时，from 物质可转化为 to；
   - inhibitions: {gene:字母,targetGene:字母}——target 显性存在但 gene 的产物缺失时，通路受抑（简化：直接令 target 催化的反应失效）。
   判定：从"前体"（入度为0的节点）出发，逐个检查反应是否可用（催化基因显性且未被抑制），
   个体表型 = 可到达的最远节点（题目图语义：转化推进到哪一步就表现哪一步的物质颜色）。
   每个基因至少在一端为显性才可用；等位翻转由 flip 控制。 */
function pwGeneActive(hyp,gene,z){
  const idx=hyp.genes.findIndex(g=>g.letter===gene);
  if(idx<0)return false;
  const l=LOC.find(x=>x.id==='n'+idx);
  if(!l)return false;
  const arr=z.all[l.id]||[];
  const domSym=hyp.flip.includes(idx)?gene.toLowerCase():gene;
  return arr.includes(domSym);
}
function pwPhenotype(hyp,z){
  const nodes=hyp.pw.nodes,reactions=hyp.pw.reactions||[],inhibitions=hyp.pw.inhibitions||[];
  if(!nodes.length)return null;
  /* 找入度为0的起点（可作为前体） */
  const targets=new Set(reactions.map(r=>r.to));
  const sources=nodes.filter(n=>!targets.has(n.id));
  const start=(sources.length?sources:nodes)[0];
  /* 抑制表：被抑制的催化基因集合。
     mode='present'（默认，可选）：gene 显性（产物存在）时抑制 targetGene —— "有A则抑制B"
     mode='absent'：gene 产物缺失时 targetGene 失效 —— 旧语义"无A则抑制B" */
  const inhDisabled=new Set();
  inhibitions.forEach(ib=>{
    const on=(ib.mode==='absent')?(!pwGeneActive(hyp,ib.gene,z)):pwGeneActive(hyp,ib.gene,z);
    if(on)inhDisabled.add(ib.targetGene);
  });
  /* 反应可用性 */
  const usable=r=>{
    if(!r.gene)return true; /* 无催化基因 = 恒可用 */
    if(inhDisabled.has(r.gene))return false;
    return pwGeneActive(hyp,r.gene,z);
  };
  /* 带优先级的推进：从起点逐步前进，每一步在可用反应中选优先级最高（pri 大者优先）的走一步；
     无可用反应或走完则停在当前节点。分支起点相同时优先级即"紫优先于绿"的表达。 */
  const pri=r=>(r.pri==null?1:r.pri);
  let cur=start.id,guard=0;
  while(guard++<nodes.length+2){
    const opts=reactions.filter(r=>r.from===cur&&usable(r));
    if(!opts.length)break;
    opts.sort((a,b)=>pri(b)-pri(a));
    cur=opts[0].to;
  }
  const node=nodes.find(n=>n.id===cur);
  return node?node.name:null;
}
/* 图解模式激活时挂接 zygPhenotype */
let ZYG_HOOK=null;
function gatherTraitNames(){
  const names=[];
  const add=n=>{if(n&&!names.includes(n))names.push(n)};
  S.simple.forEach(L=>{add(L.dom);add(L.rec);if(L.mode==='incomplete')add(L.mid)});
  S.multi.forEach(L=>{normMulti(L);L.tiers.forEach(t=>t.alleles.forEach(a=>add(a.trait)))});
  S.cyto.forEach(L=>L.variants.forEach(v=>add(v.trait)));
  return names;
}
/* 从第 gi 代应用剔除规则（规则 gen<=gi）：移除该表型个体并归一化 */
function applyRemovals(gi,pop){
  const rules=(S.removals||[]).filter(r=>r.name&&r.gen<=gi);
  const notes=[];
  if(!rules.length||!pop.length)return{pop,notes};
  let out=pop;
  rules.forEach(r=>{
    const before=out.length;
    out=out.filter(v=>zygPhenotype(v.z).indexOf(r.name)<0);
    if(out.length<before)notes.push('F'+gi+' 剔除表型「'+r.name+'」：该表型个体被移出群体（人工淘汰），剩余基因型比例重新归一化');
  });
  let tot=rZero;out.forEach(v=>tot=rAdd(tot,v.pn));
  if(!rIs0(tot))out.forEach(v=>{v.pn=rDiv(v.pn,tot);v.p=v.pn});
  else out=[];
  return{pop:out,notes};
}
/* 正推/反推共用的世代链计算（含逐代剔除） */
function forwardChain(p1,p2,mode,N,nextMode,ratio){
  nextMode=nextMode||'self';
  const gens=[];
  const step=()=>{const prev=gens[gens.length-1];const rr=applyRemovals(gens.length,prev.pop);if(rr.notes.length){prev.pop=rr.pop;prev.notes.push(...rr.notes)}};
  let eg,sp,r;
  if(mode==='self'){
    eg=makeGametes(p1,'F');sp=makeGametes(p1,'M');r=doCross(eg.list,sp.list);
    gens.push({name:'F1',pop:r.zygs,raw:r.raw,eggs:eg.list,sperm:sp.list,notes:['亲本自交：同一亲本既产生雌配子也产生雄配子',...eg.notes,...sp.notes,...r.notes],parents:[p1]});
  }else if(mode==='cross'){
    eg=makeGametes(p1,'F');sp=makeGametes(p2,'M');r=doCross(eg.list,sp.list);
    gens.push({name:'F1',pop:r.zygs,raw:r.raw,eggs:eg.list,sperm:sp.list,notes:['P♀ × P♂ 杂交 → F1',...eg.notes,...sp.notes,...r.notes],parents:[p1,p2]});
  }else{
    const a=(ratio&&ratio[0])||1,b=(ratio&&ratio[1])||1;
    gens.push({name:'F1',pop:freePop([{z:p1,p:R(a,a+b)},{z:p2,p:R(b,a+b)}]),notes:['两种亲本按 '+a+' : '+b+' 混合，雌雄配子随机结合（自由交配）→ F1']});
  }
  for(let g=2;g<=N;g++){
    step();
    const prev=gens[gens.length-1];
    if(!prev.pop.length){gens.push({name:'F'+g,pop:[],notes:['⚠ 上一代无存活个体，本代为空']});continue}
    if(mode==='free'||nextMode==='free')
      gens.push({name:'F'+g,pop:freePop(prev.pop),notes:['F'+(g-1)+' 群体内随机交配（配子随机结合）→ F'+g+'（自由交配时基因型频率趋于哈代-温伯格平衡）']});
    else
      gens.push({name:'F'+g,pop:selfPop(prev.pop),notes:['F'+(g-1)+' 各基因型分别自交（逐代迭代，等价于马尔可夫链转移矩阵连乘）→ F'+g+'（杂合子逐代减少，纯合子逐代增加）']});
  }
  step(); /* 末代展示同样应用剔除 */
  gens.forEach(g=>{if(!g.pop.length&&!g.notes.some(n=>n.indexOf('无存活')>=0))g.notes.push('⚠ 该世代无存活个体（可能全部致死）')});
  return gens;
}
function parseRatioStr(s){
  if(!s)return null;
  const parts=String(s).split(/[:：,，、]/).map(x=>x.trim()).filter(Boolean)
    .map(x=>parseNumFrac(x)).filter(x=>x);
  if(!parts.length||parts.some(p=>rIs0(p)))return null;
  return parts; /* 各段支持 整数/小数/分数(1/7)；单段'1'表示全为同一表型 */
}
/* 带名观测解析：格式 "紫:12,绿:3,白:1"（名:数，逗号/顿号分隔）。
   返回 {fracs,names}；names=null 表示纯数字比例（不绑定表型名）。 */
function parseObsStr(s){
  if(!s)return null;
  const t=String(s).trim();
  /* 先按纯比例严格预检（按冒号/逗号分割后【每一段】都必须是有效数字）——
     避免 '1:3' 被误判为"名'1'值'3'"，也避免 '紫:12,绿:3' 中名字被过滤后误判 */
  const segs=t.split(/[:：,，、]/).map(x=>x.trim());
  if(segs.length>=2){
    const vfs=segs.map(x=>parseNumFrac(x));
    if(vfs.every(x=>x)&&!vfs.some(x=>rIs0(x)))return{fracs:vfs,names:null};
  }
  const groups=t.split(/[,，、;；]/).map(x=>x.trim()).filter(Boolean);
  if(!groups.length)return null;
  const fr=[],nm=[];
  for(const g of groups){
    /* 数值支持 整数/小数/分数(1/7)；可选'名:'前缀（名不能是纯数字/分数） */
    const m=/^(?:(.*?)[:：=＝])?\s*([0-9.\s\/／]+)$/.exec(g);
    if(!m)return null;
    const pf=parseNumFrac(m[2]);
    if(!pf)return null;
    fr.push(pf);
    const rawName=m[1]?m[1].trim():'';
    if(rawName&&(/^\d+(?:\.\d+)?$/.test(rawName)||/[\/／]/.test(rawName)))return null; /* 名字是纯数字/分数：视为比例错写 */
    nm.push(rawName);
  }
  if(fr.some(f=>rIs0(f)))return null;
  const named=nm.some(x=>x.length>0);
  if(named&&nm.some(x=>!x.length))return null;
  return {fracs:fr,names:named?nm:null};
}
/* 带名比例键：名→比例 的规范化串（同键即同名同比例） */
function namedKeyOf(map){
  const names=Object.keys(map).sort();
  if(!names.length)return null;
  const L=names.reduce((a,n)=>lcm(a,map[n].d),1);
  const ks=[];
  for(const n of names){
    const k=map[n].n*L/map[n].d;
    if(!Number.isInteger(k))return null;
    ks.push({n,k});
  }
  let g=ks[0].k;
  for(const x of ks)g=gcd(g,x.k);
  if(!g)g=1;
  return ks.map(x=>x.n+':'+(x.k/g)).join('|');
}
function obsKeyFromParsed(po){ /* 统一观测键：named → namedKey；否则 ratioKey */
  if(!po)return null;
  if(po.names){
    const map={};po.names.forEach((n,i)=>map[n]=po.fracs[i]);
    return {named:true,key:namedKeyOf(map),cnt:po.names.length,map};
  }
  return {named:false,key:ratioKey(po.fracs),cnt:po.fracs.length};
}
/* 带名模糊等价：模拟表型名与观测表型名互为包含即视为同一（如"紫色物质"≈"紫"）；
   比较前各自归一化为整数比例向量（观测 12:3:1 ↔ 模拟 12/16:3/16:1/16），
   单表型时数值无意义（任何非零数都表示 100% 该表型）。 */
function normPhenVec(map){
  const names=Object.keys(map);
  const L=names.reduce((a,n)=>lcm(a,map[n].d),1);
  const vec={};let g=0;
  names.forEach(n=>{const k=map[n].n*L/map[n].d;vec[n]=k;g=gcd(g,k)});
  if(!g)g=1;
  names.forEach(n=>vec[n]=vec[n]/g);
  return vec;
}
function namedEq(simMap,obsMap){
  const obsNames=Object.keys(obsMap);

  for(const sn of simNames){
    if(obsMap[sn]!==undefined)mapped[sn]=simMap[sn];
  }
  /* 2) 剩余按包含匹配：sim 名长者优先（更具体），配对未占用的最长 obs 名 */
  const rest=simNames.filter(sn=>!(sn in mapped));
  rest.sort((a,b)=>b.length-a.length);
  for(const sn of rest){
    const cands=obsNames.filter(o=>!(o in mapped)&&(o.includes(sn)||sn.includes(o)));

    const usedGenes=new Set();
    pw.reactions.forEach(r=>{if(r.gene)usedGenes.add(r.gene)});
    pw.inhibitions.forEach(ib=>{usedGenes.add(ib.gene);usedGenes.add(ib.targetGene)});
    for(const g of usedGenes)if(!genes.find(x=>x.letter===g)){note('图解模式：箭头/抑制使用了基因 '+g+'，请先在第1步添加该基因');return}
    outerPw:
    for(const inh of cartesian(genes.map(()=>inhOpts)))
    for(const letv of cartesian(genes.map(()=>letVals)))
    for(const flip of flipSets){
      const hyp={genes,inh,let:letv,flip,inter:'pw',pw:{nodes:pw.nodes,reactions:pw.reactions,inhibitions:pw.inhibitions},swap:false,assign:null,domMode:genes.map(()=>'complete')};
      const isSex=hyp.inh.some(x=>x!=='auto');
      if(isSex&&rv.firstMode==='self')continue;
      const nextMode=isSex&&rv.nextMode==='self'?'free':rv.nextMode;
      if(!REV_MODE)REV_MODE=true;
      applyRevHypothesis(hyp);
      CALC.gamete.clear();CALC.self.clear();CALC.free.clear();
      ZYG_HOOK=z=>pwPhenotype(hyp,z); /* 图解表型 */
      const combos=revParentCandidates(hyp);
      for(const c of combos){
        tried++;

        /* c.p1 / c.p2 已是完整亲本对象，不能再包一层 {all:...} */
        const P1=c.p1,P2=c.p2;
        if(g1obs.length){
          const eg=makeGametes(P1,'F'),sp=makeGametes(P2,'M');
          const r=doCross(eg.list,sp.list);
          if(!obsMatch(r.zygs,g1obs[0]))continue;

        const gens=forwardChain(P1,P2,rv.firstMode,N,nextMode);
        let ok=true;
        for(const o of obs){
          if(!obsMatch(gens[o.gen-1].pop,o)){ok=false;break}
        }
        if(ok)matches.push({p1:P1,p2:P2,hyp});
        if(matches.length>=60)break outerPw;
      }
      ZYG_HOOK=null;
    }
    ZYG_HOOK=null;
    S=SAVED;DOM_FLIP=new Set();rebuildLoci();
    S.rev.result={matches,tried,obs,N};revStale=false;
    if(!matches.length){
      lastResult=null;renderDiagram();
      note('图解模式：尝试了 '+tried+' 种组合（含传递方式/致死/显隐互换'+(rv.trySex?'、伴性':'')+'），均无法匹配。请检查图解结构、比例数据或亲本表型约束。');
      return;
    }
    const m0=matches[0];
    const nm0=m0.hyp.inh.some(x=>x!=='auto')&&rv.nextMode==='self'?'free':rv.nextMode;
    applyRevHypothesis(m0.hyp);
    ZYG_HOOK=z=>pwPhenotype(m0.hyp,z);
    lastResult={gens:forwardChain(m0.p1,m0.p2,rv.firstMode,N,nm0),p1:m0.p1,p2:m0.p2,mode:rv.firstMode,hyp:m0.hyp,pwMode:true};
    ZYG_HOOK=null;
    S=SAVED;DOM_FLIP=new Set();rebuildLoci();
    renderDiagram();

  }
  outer:
  for(const inter of interOpts)
  for(const swap of swapOpts)
  for(const domMode of cartesian(domModeOpts))
  for(const assign of assignOptsFor(inter))
  for(const inh of cartesian(genes.map(()=>inhOpts)))
  for(const letv of cartesian(genes.map(()=>letVals)))
  for(const flip of flipSets){
    /* 从性遗传基因为常染色体：跳过伴性/同源区段组合 */
    if(domMode.some((x,j)=>x.indexOf('sexInf')===0&&inh[j]!=='auto'))continue;
    const hyp={genes,inh,let:letv,flip,inter,swap,assign,domMode};
    const isSex=hyp.inh.some(x=>x!=='auto');
    if(isSex&&rv.firstMode==='self')continue; /* 伴性不支持单亲自交，跳过该假设 */
    const nextMode=isSex&&rv.nextMode==='self'?'free':rv.nextMode; /* 伴性时"自交"按群体内自由交配处理（雌雄异体） */
    if(!REV_MODE)REV_MODE=true;
    applyRevHypothesis(hyp);
    CALC.gamete.clear();CALC.self.clear();CALC.free.clear();
    const combos=revParentCandidates(hyp);
    for(const c of combos){
      tried++;

      /* 注意：revParentCandidates 返回的 c.p1 / c.p2 已经是完整亲本对象

      const P1=c.p1,P2=c.p2;
      /* F₁ 快速剪枝 */
      if(g1obs.length){
        const eg=makeGametes(P1,'F'),sp=makeGametes(P2,'M');
        const r=doCross(eg.list,sp.list);
        if(!obsMatch(r.zygs,g1obs[0]))continue;
      }
      const gens=forwardChain(P1,P2,rv.firstMode,N,nextMode);
      let ok=true;
      for(const o of obs){
        if(!obsMatch(gens[o.gen-1].pop,o)){ok=false;break}
      }
      if(ok)matches.push({p1:P1,p2:P2,hyp});
      if(matches.length>=60)break outer;
    }
  }
  /* 恢复原状态（注意：S 已被替换为克隆，须重新取 S.rev） */
  S=SAVED;
  DOM_FLIP=new Set();
  rebuildLoci();
  S.rev.result={matches,tried,obs,N};revStale=false;
  if(!matches.length){
    lastResult=null;
    renderDiagram();
    note('尝试了 '+tried+' 种组合假设（含传递方式'+(rv.trySex?'、伴性':'')+(rv.tryLethal?'、致死':'')+(rv.tryInter?'、互作':'')+(rv.domUnknown?'、显隐性互换':'')+'），均无法匹配所给比例。');
    return;
  }
  const m0=matches[0];
  const nm0=m0.hyp.inh.some(x=>x!=='auto')&&rv.nextMode==='self'?'free':rv.nextMode;
  applyRevHypothesis(m0.hyp);
  lastResult={gens:forwardChain(m0.p1,m0.p2,rv.firstMode,N,nm0),p1:m0.p1,p2:m0.p2,mode:rv.firstMode,hyp:m0.hyp};
  S=SAVED;DOM_FLIP=new Set();rebuildLoci();
  renderDiagram();
}
/* 反推图解渲染辅助：在假设配置下执行渲染，完成后恢复用户原状态 */
function withRevHyp(fn){
  if(!(lastResult&&lastResult.hyp)){fn();return}
  const SAVED=cloneState();
  const revWas=REV_MODE;REV_MODE=true;
  applyRevHypothesis(lastResult.hyp);
  CALC.gamete.clear();CALC.self.clear();CALC.free.clear();clearGenCache();
  CALC.gamete.clear();CALC.self.clear();CALC.free.clear();clearGenCache();
  if(lastResult.hyp.inter==='pw')ZYG_HOOK=z=>pwPhenotype(lastResult.hyp,z);
  try{fn()}finally{ZYG_HOOK=null;S=SAVED;DOM_FLIP=new Set();REV_MODE=revWas;rebuildLoci();calcCacheReset();clearGenCache()}
}
function hypDesc(m){
  const parts=[];
  m.hyp.genes.forEach((g,i)=>{
    const inh=m.hyp.inh[i];
    const dm=m.hyp.domMode?m.hyp.domMode[i]:'complete';
    const way=inh==='auto'?'常染色体':inh==='X'?'伴X':inh==='Y'?'伴Y（限♂）':'X/Y同源区段';
    let s=g.letter+'：'+way;
    if(dm==='sexInfM')s+='（从性遗传，杂合♂显性/♀隐性）';
    if(dm==='sexInfF')s+='（从性遗传，杂合♂隐性/♀显性）';
    if(m.hyp.flip.includes(i))s+='，'+g.letter.toLowerCase()+' 对 '+g.letter+' 显性';
    if(m.hyp.let[i]==='domHom')s+='，'+g.letter+g.letter+' 致死';
    if(m.hyp.let[i]==='recHom')s+='，'+g.letter.toLowerCase()+g.letter.toLowerCase()+' 致死';
    parts.push(s);
  });
  if(m.hyp.inter==='pw'){
    /* 图解模式：按用户画的通路图描述 */
    const pw=m.hyp.pw;
    const nodeById=id=>pw.nodes.find(n=>n.id===id);
    const rx=(pw.reactions||[]).filter(r=>r.gene).map(r=>{
      const a=nodeById(r.from),b=nodeById(r.to);
      return r.gene+'基因显性时：'+(a?a.name:'?')+' → '+(b?b.name:'?');
    });
    const ix=(pw.inhibitions||[]).map(ib=>ib.gene+'基因'+((ib.mode==='absent')?'产物缺失时抑制':'存在时抑制')+ib.targetGene+'基因的作用');
    parts.push('通路图：'+rx.join('；')+(ix.length?'；'+ix.join('；'):'')+'；表型=物质转化推进到的最远物质');
    return parts.join('；');
  }
  if(m.hyp.inter&&m.hyp.inter!=='none'){
    const nm={complement:'互补(A_B_↔其一显)',recessiveEpi:'隐性上位',dominantEpi:'显性上位',inhibitor:'抑制',duplicate:'重叠',additive:'积加'}[m.hyp.inter]||m.hyp.inter;
    const GA=m.hyp.genes[m.hyp.swap?1:0].letter,GB=m.hyp.genes[m.hyp.swap?0:1].letter;
    let s=GA+' 与 '+GB+' '+nm+'互作';
    if(m.hyp.assign&&m.hyp.assign.length){
      const slotDesc={complement:['A_B_','任一隐性纯合'],recessiveEpi:['A_B_','一方显+另一方隐纯','上位纯合'],dominantEpi:['上位显性_','下位显性_','双隐'],inhibitor:['被抑制类','仅下位显'],duplicate:['任一显性','双隐'],additive:['双显','单显','双隐']}[m.hyp.inter]||[];
      const pairs=m.hyp.assign.map((a,i)=>(slotDesc[i]||('槽'+(i+1)))+'='+a).join('，');
      s+='（'+pairs+'）';
    }
    parts.push(s);
  }else if(m.hyp.assign&&m.hyp.assign.length===2){
    parts.push('表型分配：'+m.hyp.genes[0].letter+'_ → '+m.hyp.assign[0]+'，'+m.hyp.genes[0].letter.toLowerCase()+m.hyp.genes[0].letter.toLowerCase()+' → '+m.hyp.assign[1]);
  }
  return parts.join('；');
}

/* 反推：可用性状候选（优先"表型清单"，其次各基因的显/隐性性状注释）。

function traitOptions(){
  const rv=S.rev;
  const list=(rv.phenList||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean);
  if(list.length)return[...new Set(list)];
  const out=[];
  (rv.genes||[]).forEach(g=>{
    if(g.dom&&!out.includes(g.dom))out.push(g.dom);

  });

}

  svg.style.border='1px solid var(--line)';svg.style.borderRadius='12px';
  const mk=(t,a,txt)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e};

  });
  /* 连线（自动避让：同起点线彼此错开锚点 + 曲线垂直偏移） */
  pw.reactions.forEach((r,k)=>{
    const a=nodeById(r.from),b=nodeById(r.to);
    if(!a||!b)return;
    const oi=(outIdx[r.from]=outIdx[r.from]==null?0:outIdx[r.from]+1)-1;
    const ii=(inIdx[r.to]=inIdx[r.to]==null?0:inIdx[r.to]+1)-1;
    const p1=edgeAnchor(a,b.x,b.y,oi,outTot[r.from]);
    const p2=edgeAnchor(b,a.x,a.y,ii,inTot[r.to]);
    /* 中点控制：垂直于连线的偏移，多线时扇形分开（重合区域自动绕开） */
    const mx0=(p1.x+p2.x)/2,my0=(p1.y+p2.y)/2;
    const dx=p2.x-p1.x,dy=p2.y-p1.y;
    const len=Math.max(1,Math.hypot(dx,dy));
    const k2=(outTot[r.from]>1||inTot[r.to]>1)?(oi-(outTot[r.from]-1)/2)*26:0;
    const nx=-dy/len,ny=dx/len;
    const mx=mx0+nx*k2,my=my0+ny*k2;
    svg.append(mk('path',{d:'M'+p1.x+' '+p1.y+' Q'+mx+' '+my+' '+p2.x+' '+p2.y,fill:'none',stroke:'#4f6ef7','stroke-width':1.8,'marker-end':'url(#pwArrow)'}));
    /* 催化基因选择（跟随箭头中点，加大尺寸便于点选） */
    const geneOpts=[['','（不指定催化基因）']].concat(rv.genes.map(g=>[g.letter,'酶'+g.letter+'：'+g.letter+' 显性时此步才进行']));
    const fo=mk('foreignObject',{x:mx-112,y:my-44,width:224,height:44});
    const hbox=document.createElement('div');
    hbox.className='pwEnzyme';
    const lab=document.createElement('div');
    lab.className='lbl';
    lab.textContent='催化基因（酶）';
    const sel=document.createElement('select');
    sel.title='催化基因（酶）：该基因显性时此步转化才能进行';
    sel.style.cssText='width:100%';
    geneOpts.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];if(o[0]===r.gene)op.selected=true;sel.append(op)});
    sel.onchange=()=>{r.gene=sel.value};
    const priSel=document.createElement('select');
    priSel.title='分支优先级：起点相同时，数字大的产物优先表现（如模式二"紫(2)优先于绿(1)"）';
    priSel.style.cssText='font-size:12px;padding:4px 6px;margin-top:3px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)';
    ['1','2','3'].forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent='分支优先级 优'+v;if(String(r.pri==null?1:r.pri)===v)op.selected=true;priSel.append(op)});
    priSel.onchange=()=>{r.pri=parseInt(priSel.value)};
    hbox.append(lab,sel,priSel);
    fo.append(hbox);svg.append(fo);
    const del=mk('text',{x:mx+114,y:my-16,'font-size':12,fill:'#dc2626',cursor:'pointer'},'✕');
    del.addEventListener('click',()=>{pw.reactions.splice(k,1);renderRun()});
    svg.append(del);
  });
  /* 抑制虚线（基因→基因，画在底部） */
  pw.inhibitions.forEach((ib,k)=>{
    const y=H-24-(k*18);
    const gA=rv.genes.find(g=>g.letter===ib.gene),gB=rv.genes.find(g=>g.letter===ib.targetGene);
    if(!gA||!gB)return;
    svg.append(mk('line',{x1:200,y1:y,x2:340,y2:y,stroke:'#d97706','stroke-width':1.6,'stroke-dasharray':'5,3'}));
    svg.append(mk('text',{x:270,y:y-4,'text-anchor':'middle','font-size':10.5,fill:'#d97706'},(ib.mode==='absent'?'无':'有')+ib.gene+' → 抑制 '+ib.targetGene));
    const del=mk('text',{x:352,y:y,'font-size':11,fill:'#dc2626',cursor:'pointer'},'✕');
    del.addEventListener('click',()=>{pw.inhibitions.splice(k,1);renderRun()});
    svg.append(del);
  });
  if(pw.inhibitions.length<3){
    /* 画布内的快捷入口：基因不足 2 个时会自动补一个基因再建抑制线 */
    const y=H-24-(pw.inhibitions.length*18);
    const addInh=mk('text',{x:16,y:y+4,'font-size':11.5,fill:'#d97706',cursor:'pointer','font-weight':600},'+ 抑制线');
    addInh.addEventListener('click',()=>pwAddInhibition());
    svg.append(addInh);
  }
  /* 物质框（可拖动） */
  pw.nodes.forEach((n,k)=>{
    const g=mk('g',{cursor:'move'});
    const rect=mk('rect',{x:n.x-NW/2,y:n.y-NH/2,width:NW,height:NH,rx:8,fill:'#eef1fe',stroke:'#4f6ef7','stroke-width':1.4});
    g.append(rect);
    const fo=mk('foreignObject',{x:n.x-NW/2+3,y:n.y-NH/2+5,width:NW-6,height:NH-10});
    const inp=document.createElement('input');
    inp.type='text';inp.value=n.name;
    inp.style.cssText='width:100%;border:none;background:transparent;text-align:center;font-size:11px;color:#1c2128;outline:none';
    inp.oninput=()=>{n.name=inp.value};
    fo.append(inp);g.append(fo);
    /* 连线按钮（框右侧，配底色小圆角便于点击） */
    const lg=mk('g',{cursor:'pointer'});
    const lrect=mk('rect',{x:n.x+NW/2+2,y:n.y-9,width:20,height:18,rx:5,fill:pwLinkFrom===n.id?'#dc2626':'#059669'});
    const ltxt=mk('text',{x:n.x+NW/2+12,y:n.y+4,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},'连');
    lg.append(lrect,ltxt);
    lg.addEventListener('click',ev=>{
      ev.stopPropagation();
      if(pwLinkFrom==null){pwLinkFrom=n.id}
      else if(pwLinkFrom!==n.id){
        pw.reactions.push({from:pwLinkFrom,to:n.id,gene:''});

    g.append(lg);

    let drag=null;
    rect.addEventListener('mousedown',ev=>{drag={ox:ev.clientX,oy:ev.clientY,x:n.x,y:n.y}});
    rect.addEventListener('touchstart',ev=>{const t=ev.touches[0];drag={ox:t.clientX,oy:t.clientY,x:n.x,y:n.y}},{passive:true});
    const move=ev=>{
      if(!drag)return;
      const cx=ev.clientX!=null?ev.clientX:ev.touches[0].clientX;
      const cy=ev.clientY!=null?ev.clientY:ev.touches[0].clientY;
      n.x=Math.max(NW/2+24,Math.min(W-NW/2-24,drag.x+cx-drag.ox));
      n.y=Math.max(NH/2,Math.min(H-NH/2,drag.y+cy-drag.oy));
      rect.setAttribute('x',n.x-NW/2);rect.setAttribute('y',n.y-NH/2);
      fo.setAttribute('x',n.x-NW/2+3);fo.setAttribute('y',n.y-NH/2+5);
      lrect.setAttribute('x',n.x+NW/2+2);lrect.setAttribute('y',n.y-9);
      ltxt.setAttribute('x',n.x+NW/2+12);ltxt.setAttribute('y',n.y+4);
    };
    const up=()=>{if(drag){drag=null;renderRun()}};
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
    window.addEventListener('touchmove',move,{passive:true});
    window.addEventListener('touchend',up);
    /* 删除框 */
    const delN=mk('text',{x:n.x+NW/2+4,y:n.y-NH/2+4,'font-size':10,fill:'#dc2626',cursor:'pointer'},'✕');
    delN.addEventListener('click',ev=>{ev.stopPropagation();
      pw.nodes.splice(k,1);
      pw.reactions=pw.reactions.filter(r=>r.from!==n.id&&r.to!==n.id);
      renderRun();
    });
    g.append(delN);
    svg.append(g);
  });
  /* 箭头 marker */
  const defs=mk('defs');
  const marker=mk('marker',{id:'pwArrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
  marker.append(mk('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#4f6ef7'}));
  defs.append(marker);svg.prepend(defs);
  const wrap2=el('div',{class:'chromwrap'},svg);
  wrap.append(wrap2);
  /* 抑制线编辑（表单方式；基因不足 2 个也能点——会自动补一个基因） */
  const inb=el('div');
  inb.append(el('div',{class:'hint',html:'<b>抑制线</b>可选两种语义：<b>有 A 则抑制 B</b>（默认；A 的产物存在时，B 催化的那一步反应不能进行）／<b>无 A 则抑制 B</b>（A 的产物缺失时 B 失效）。'}));
  pw.inhibitions.forEach((ib,k)=>{
    const row=el('div',{class:'row'});
    row.append(el('span',{class:'badge'},'抑制'+(k+1)));
    row.append(selIn(ib.gene,rv.genes.map(g=>[g.letter,g.letter+' 基因']),v=>{ib.gene=v;renderRun()}));
    row.append(selIn(ib.mode||'present',[['present','存在时抑制（有A则抑制B）'],['absent','缺失时抑制（无A则抑制B）']],v=>{ib.mode=v;renderRun()}));
    row.append(selIn(ib.targetGene,rv.genes.map(g=>[g.letter,g.letter+' 基因']),v=>{ib.targetGene=v;renderRun()}));
    row.append(el('button',{class:'btn mini danger',onclick:()=>{pw.inhibitions.splice(k,1);renderRun()}},'删'));
    inb.append(row);
  });
  const addInhBtn=el('button',{class:'addbtn',onclick:()=>pwAddInhibition()},'+ 添加抑制线（有A则抑制B）');
  if(pw.inhibitions.length>=3)addInhBtn.disabled=true;
  inb.append(addInhBtn);
  if(rv.genes.length<2)inb.append(el('div',{class:'hint'},'当前只有 1 个基因：点上面的按钮会**自动补一个基因**再建立抑制线（抑制关系需要「甲基因抑制乙基因」两个基因）。'));
  wrap.append(inb);
  return wrap;
}
/* 新增一条抑制线；基因不足 2 个时自动补一个基因（避免"抑制线加不了"） */
function pwAddInhibition(){
  const rv=S.rev,pw=rv.pw;
  if(pw.inhibitions.length>=3){toast('最多 3 条抑制线');return}
  let gs=(rv.genes||[]).map(g=>g.letter).filter(Boolean);
  let added=null;
  if(gs.length<2){
    const used=new Set(gs);
    let letter='B';
    for(const c of LETTERS){if(!used.has(c)){letter=c;break}}
    rv.genes.push({letter:letter,dom:'',rec:''});
    rebuildLoci();
    added=letter;
    gs=(rv.genes||[]).map(g=>g.letter).filter(Boolean);
  }
  pw.inhibitions.push({gene:gs[0],targetGene:gs[1],mode:'present'});
  renderRun();
  if(added)toast('已自动添加基因 '+added+'，并建立抑制线「有 '+gs[0]+' 则抑制 '+gs[1]+'」——可在下方修改基因与语义。');
}
/* 反推：只刷新"亲本表型"下拉的选项（不动其它输入，避免打字时丢焦点） */
function refreshRevPhenSelects(){
  const opts=[...new Set(traitOptions())];
  const fill=(sel,arr)=>{
    const cur=sel.value;
    sel.textContent='';
    arr.forEach(p=>{
      const o=document.createElement('option');
      o.value=p[0];o.textContent=p[1];
      if(String(p[0])===String(cur))o.selected=true;
      sel.append(o);
    });
  };
  const all=document.querySelectorAll('.revPhenSel');
  for(let i=0;i<all.length;i++)fill(all[i],[['','（未指定）']].concat(opts.map(n=>[n,n])));
  const per=document.querySelectorAll('.revPhenSelG');
  for(let i=0;i<per.length;i++){
    const gi=parseInt(per[i].getAttribute('data-g'),10)||0;
    const g=(S.rev.genes||[])[gi]||{};
    const arr=[['','（未指定）']];
    if(g.dom)arr.push([g.dom,g.dom]);
    if(g.rec)arr.push([g.rec,g.rec]);
    fill(per[i],arr);
  }
}
/* 反推：一键示例（把基因/表型清单/观测一次填好，省去重复输入） */
function revPreset(kind){
  const rv=S.rev;
  const mk=(letter,dom,rec)=>({letter:letter,dom:dom||'',rec:rec||''});
  if(kind==='one'){
    rv.genes=[mk('A','紫花','白花')];
    rv.phenList='';
    rv.obs=[{gen:2,ratio:'3:1',sep:false}];
    rv.tryInter=false;
  }else if(kind==='two'){
    rv.genes=[mk('A','高茎','矮茎'),mk('B','长粒','圆粒')];
    rv.phenList='';
    rv.obs=[{gen:2,ratio:'3:1',sep:false}];
    rv.tryInter=false;
  }else{ /* epi：只写了 2 个基因却给出 9:3:4 */
    rv.genes=[mk('A','',''),mk('B','','')];
    rv.phenList='紫,红,白';
    rv.obs=[{gen:2,ratio:'紫:9,红:3,白:4',sep:false}];
    rv.tryInter=true;
  }
  rv.p1Phen={};rv.p2Phen={};rv.chrom=[];rv.result=null;rv.pw.enabled=false;
  revStale=true;
  rebuildLoci();
  refreshPanel('反推');
  renderRun();
  toast('已填入示例，可直接点「开始反推」，也可自行修改');
}

/* ================= 遗传计算引擎 ================= */
function rDiv(a,b){return R(a.n*b.d,a.d*b.n)}
function condMatch(c,allMap){
  const arr=(allMap&&allMap[c.locus])||[];
  const has=arr.includes(c.allele);
  if(c.type==='has')return has;
  if(c.type==='nothas')return!has;
  if(c.type==='hom')return arr.length>=2&&arr.every(x=>x===c.allele);
  if(c.type==='het')return has&&arr.some(x=>x!==c.allele);
  return false;
}
function buildUnits(){
  const units=[];
  ['simple','multi'].forEach(g=>{
    const ch=S.chrom[g];
    const ls=groupLoci(g).filter(l=>!(l.group==='simple'&&l.def.inherit!=='auto'));
    const placedIds=new Set();
    for(let p=0;p<ch.pairs;p++){
      const pl=ch.placed.filter(x=>x.pair===p&&x.col!=null&&x.sym!=null&&ls.some(l=>l.id===x.locus)).sort((a,b)=>a.slot-b.slot);
      if(!pl.length)continue;
      const seen=new Set(),loci=[];
      pl.forEach(x=>{if(!seen.has(x.locus)){seen.add(x.locus);loci.push(x.locus)}});
      const placedByCol={};
      pl.forEach(x=>{
        if(!placedByCol[x.locus])placedByCol[x.locus]={};
        if(placedByCol[x.locus][x.col]==null)placedByCol[x.locus][x.col]=x.sym;
      });
      loci.forEach(id=>placedIds.add(id));
      /* 复等位基因座：某个"符号"在图上被放到哪个染色体列，决定了相引/相斥。
         仅在反推模式且存在额外基因时才登记（键：基因座id|符号:列），避免污染普通复等位座。 */

      const rec=[],recWarn=[];
      for(let k=0;k<loci.length-1;k++){
        const raw=(ch.rec[p]&&ch.rec[p][k]!=null&&ch.rec[p][k]!=='')?ch.rec[p][k]:50;
        let v=pctIn(raw);
        /* 知识校正：交换值 = 重组型配子占该对基因全部配子的百分率，理论上限 50%。
           50% 即自由组合；超过 50% 在遗传学上没有意义（连锁越远越接近 50%，但不会超过），
           故按 50% 处理并给出提示。 */
        if(rNum(v)<0)v=R(0);
        if(rNum(v)*100>50){
          v=R(1,2);
          recWarn.push(chromLocusName(locusById(loci[k]))+'—'+chromLocusName(locusById(loci[k+1]))+' 的交换值填了 '+raw+'%，超过理论上限 50%，已按 50%（自由组合）计算');
        }
        rec.push(v);
      }
      units.push({kind:'auto',group:g,pair:p,loci,rec,recWarn,placedByCol,ploidy:ch.ploidy[p]||2,triMode:ch.triMode||'indep',nullG:ch.nullG||'dead'});
    }
    ls.forEach(l=>{
      if(!placedIds.has(l.id))units.push({kind:'auto',group:g,pair:-1,loci:[l.id],rec:[],recWarn:[],ploidy:2,triMode:'indep',nullG:'dead'});
    });
  });
  if(S.sexSystem!=='none'){
    units.push({kind:'sex',
      xl:LOC.filter(l=>l.group==='simple'&&(l.def.inherit==='X'||l.def.inherit==='both')).map(l=>l.id),
      yl:LOC.filter(l=>l.group==='simple'&&(l.def.inherit==='Y'||l.def.inherit==='both')).map(l=>l.id)});
  }
  return units;
}
/* 相位解析：按图中各同源染色体上放置的等位基因重排亲本等位顺序（构成相引/相斥） */
function phasedAlleleArr(u,locusId,parent){
  const arr=((parent.all[locusId]||[]).filter(x=>x!=null));
  let byCol=u.placedByCol&&u.placedByCol[locusId];
  if(false){
    /* 复等位座：键为 "符号1|符号2:列" */
    const conv={};
    Object.keys(u.placedByCol).forEach(k=>{
      const m=/^(.*):(\d+)$/.exec(k);
      if(!m)return;
      const syms=m[1].split('|');
      if(syms.includes(locusId))conv[m[2]]=locusId;
    });
    if(Object.keys(conv).length)byCol=conv;
  }
  if(!byCol||!arr.length)return arr;
  const n=Math.max(arr.length,Object.keys(byCol).reduce((a,c)=>Math.max(a,+c+1),0));
  const out=new Array(Math.max(arr.length,1)).fill(null);
  const used=new Set();
  for(let c=0;c<arr.length;c++){
    const want=byCol[c];
    if(want!=null){
      const idx=arr.findIndex((a,i)=>a===want&&!used.has(i));
      if(idx>=0){out[c]=want;used.add(idx)}
    }
  }
  let j=0;
  for(let c=0;c<arr.length;c++){
    if(out[c]==null){
      while(j<arr.length&&used.has(j))j++;
      if(j<arr.length){out[c]=arr[j];used.add(j)}
    }
  }
  return out.map((x,i)=>x==null?arr[i]:x);
}
/* 二倍体连锁单元：路径法（相邻区间独立交换，无干涉近似） */
function autoGametes2(u,parent){
  const loci=u.loci,k=loci.length,out=[];
  if(k>14)return out;
  const phased=loci.map(id=>phasedAlleleArr(u,id,parent));
  const h0=phased.map(a=>a[0]!=null?a[0]:null);
  const h1=phased.map(a=>a[1]!=null?a[1]:null);
  for(let mask=0;mask<(1<<k);mask++){
    const hap={};let p=R(1,2);
    for(let i=0;i<k;i++){
      const bit=(mask>>i)&1;
      hap[loci[i]]=bit?[h1[i]]:[h0[i]];
      if(i>0){
        const r=u.rec[i-1];
        const prev=(mask>>(i-1))&1;
        p=rMul(p,bit===prev?rSub(rOne,r):r);
      }
    }
    out.push({hap,p});
  }
  return out;
}
/* 多拷贝（三体/四体）单元 */
function autoGametesMulti(u,parent){
  const loci=u.loci,m=u.ploidy;
  const phased=loci.map(id=>phasedAlleleArr(u,id,parent));
  const strands=[];
  for(let c=0;c<m;c++)strands.push(phased.map(a=>(a[c]!=null)?a[c]:null));
  const seen=new Map();
  function add(idxs,p){
    const hap={};
    loci.forEach((id,i)=>{hap[id]=idxs.map(j=>strands[j][i]).filter(x=>x!=null)});
    const key=JSON.stringify(hap);
    const e=seen.get(key);
    if(e)e.p=rAdd(e.p,p);else seen.set(key,{hap,p});
  }
  if(u.triMode==='to21'){
    const hi=Math.ceil(m/2),lo=Math.floor(m/2),subs=[];
    for(let mask=0;mask<(1<<m);mask++){
      const idxs=[];for(let j=0;j<m;j++)if(mask&(1<<j))idxs.push(j);
      if(idxs.length===hi||idxs.length===lo)subs.push(idxs);
    }
    subs.forEach(sb=>add(sb,R(1,subs.length)));
  }else{
    const kept=[];
    for(let mask=0;mask<(1<<m);mask++){
      const idxs=[];for(let j=0;j<m;j++)if(mask&(1<<j))idxs.push(j);
      if(!idxs.length&&u.nullG==='dead')continue;
      kept.push(idxs);
    }
    const w=R(1,kept.length);
    kept.forEach(idxs=>add(idxs,w));
  }
  return [...seen.values()];
}
/* 性染色体单元 */
function sexGametes(u,parent,role){
  const isHet=(S.sexSystem==='XY')?(role==='M'):(role==='F');
  const ids=[...new Set(u.xl.concat(u.yl))];
  function mk(type,idx){
    const al={};
    ids.forEach(id=>{
      const inh=locusById(id).def.inherit;
      const a=parent.all[id]||[];
      if(inh==='X')al[id]=((!isHet||idx===0)&&a[idx]!=null)?a[idx]:null;
      else if(inh==='Y')al[id]=((isHet&&idx===1)&&a[0]!=null)?a[0]:null;
      else al[id]=(a[idx]!=null)?a[idx]:null;
    });
    return{type,al,p:R(1,2)};
  }
  let t1,t2;
  if(S.sexSystem==='XY'){t1='X';t2=isHet?'Y':'X'}
  else{t1='Z';t2=isHet?'W':'Z'}
  const s1=mk(t1,0),s2=mk(t2,1);
  return[s1,s2];
}
/* 生成某亲本某性别角色的全部配子 */
/* 反推专用：可选基因对数 nGen 会在用户给出的基因之后追加若干"题目未写出的互补基因"。
   它们与普通基因完全一样（常染色体、各自独立分配、可以用染色体位置设连锁），
   这样"aa 掩盖 B 表现 9:3:4 / A_ 掩盖 B 表现 12:3:1"这类题才能被正确枚举。 */
function revAlleleSyms(l){
  /* 反推里 simple 基因座的等位由基因字母决定（含自动追加的"未写出的基因"，如 C/c） */
  if(l&&l.group==='simple'){
    const letter=l.def&&l.def.letter?l.def.letter:((S.rev&&S.rev.genes&&S.rev.genes[0]&&S.rev.genes[0].letter)||'A');
    return [letter,letter.toLowerCase()];
  }
  const g0=(S.rev&&S.rev.genes&&S.rev.genes[0]&&S.rev.genes[0].letter)||'A';
  return [g0,g0.toLowerCase()];
}
/* 反推：第 k 个基因所用的字母。
   k < 用户填写的基因数 → 直接用用户字母；否则是自动追加的"未写出的基因"（跳过已用字母顺延）。 */
function revGeneLetter(k){
  const gs=(S.rev&&S.rev.genes)||[];
  if(k<gs.length)return (gs[k].letter||LETTERS[k]||'G');
  const used=new Set(gs.map(g=>g.letter));
  let n=0;
  for(let i=0;i<26;i++){
    const c=LETTERS[i];
    if(used.has(c))continue;
    if(n===k-gs.length)return c;
    n++;
  }
  return 'X'+k;
}
function revGeneInfo(k){
  const gs=(S.rev&&S.rev.genes)||[];
  if(k<gs.length){
    const L=gs[k].letter||LETTERS[k]||'G';
    return{dletter:L,dom:gs[k].dom||(L+'_ 显性'),rec:gs[k].rec||(L.toLowerCase()+L.toLowerCase()+' 隐性'),extra:false};
  }
  const L=revGeneLetter(k);
  return{dletter:L,dom:L+'_ 显性',rec:L.toLowerCase()+L.toLowerCase()+' 隐性',extra:true};
}/* 反推：全部参与计算的基因（用户填写的 + 额外追加的） */
function revNGen(){return Math.max(0,Math.min(6,(S.rev&&S.rev.nGen)|0))}
function revGeneCount(){
  /* 只有显式设置了"额外基因"才追加；否则严格用用户填写的基因数 */
  return ((S.rev&&S.rev.genes)||[]).length+revNGen();
}
let REV_MODE=false;
function makeGametes(parent,role){
  const ck=zKey(parent)+'#'+role;
  const hit=CALC.gamete.get(ck);
  /* 必须返回全新对象：调用方会给每个配子写 pn/surv，若直接返回缓存对象会污染缓存 */
  if(hit){CALC.stat.hit++;return{list:hit.list.map(e=>({g:e.g,p:e.p,pn:e.pn,surv:e.surv})),notes:hit.notes.slice()}}
  CALC.stat.miss++;

  LOC.forEach(l=>padAlleles(parent,l));

  let list=[{hap:{},sexType:null,sexAll:null,cyto:(role==='F'&&parent.cyto)?parent.cyto:null,mom:(role==='F')?parent:null,p:R(1)}];
  units.forEach(u=>{

      const gs=sexGametes(u,parent,role);
      gs.forEach(g=>list.forEach(b=>next.push({hap:b.hap,sexType:g.type,sexAll:g.al,cyto:b.cyto,mom:b.mom,p:rMul(b.p,g.p)})));

        const nm=u.loci.map(id=>{const l=locusById(id);return l.group==='simple'?l.letter:l.def.letter}).join('—');
        notes.push('连锁：'+nm+' 位于同一对染色体，相邻交换值 '+rp+'% → 亲本型(不交换)各 (1-r)/2，重组型各 r/2');
      }
      const gs=autoGametes2(u,parent);

function combineZygote(eg,sp){

function sortAlleles(l,arr){return arr.slice().sort((a,b)=>alleleSyms(l).indexOf(a)-alleleSyms(l).indexOf(b))}

function doCross(eggs,sperm){

  const map=new Map();
  eggs.forEach(e=>sperm.forEach(s=>{
    /* 不要改写传入的配子对象（它们可能来自缓存），概率存在局部变量里 */
    const pe=(e.pn!=null?e.pn:e.p),ps=(s.pn!=null?s.pn:s.p);
    const p=rMul(pe,ps);
    if(rIs0(p))return;
    const z=combineZygote(e.g,s.g);
    const k=zKey(z);
    const ex=map.get(k);
    if(ex)ex.p=rAdd(ex.p,p);else map.set(k,{z,p,preP:p});
  }));

    map.forEach(v=>{
      let surv=R(1);

        if(rule.conds.length&&rule.conds.every(c=>condMatch(c,v.z.all)))

      });
      v.dead=!rEq(surv,rOne);
      v.p=rMul(v.p,surv);
    });

    const after=[...map.values()].reduce((a,v)=>rAdd(a,v.p),rZero);
    if(!rIs0(before)){
      deadFrac=rSub(rOne,rDiv(after,before));
      if(!rIs0(deadFrac))notes.push('合子致死：死亡合计 '+rPct(deadFrac)+'，存活 '+rPct(rSub(rOne,deadFrac))+'；后代比例按存活个体归一化');
    }
  }
  let tot=rZero;map.forEach(v=>tot=rAdd(tot,v.p));
  const zygs=[];
  map.forEach(v=>{if(!rIs0(v.p)){v.pn=rDiv(v.p,tot);zygs.push(v)}});

function popGametePool(pop,role){

    const gs=makeGametes(item.z,role).list;
    gs.forEach(g=>{

/* 巴氏小体：确定固缩失活的是哪条 X（返回 0/1），null 表示随机失活。
   机制：XX 中必有且仅有一条 X 失活（每条各 50%）；若"促进X固缩"互作基因显性，则携带它的那条 X 优先失活 */
function barrInactIdx(z){
  if(!S.barr)return null;
  if(!z||z.sex!=='F')return null; /* 巴氏小体仅雌性 XX：雄性唯一 X 不失活 */
  const it=S.inter;
  if(it.enabled&&it.type==='xInact'&&it.locusA){
    const rateR=pctIn(it.xInactRate==null?100:it.xInactRate);
    if(rNum(rateR)<=0)return null; /* 固缩率 0% = 不促进，回到随机失活 */
    const B=locusById(it.locusA);
    if(B&&B.group==='simple'&&B.def.inherit==='X'){
      const arr=z.all[B.id]||[];
      if(arr.length===2&&arr[0]!==arr[1]){
        const domSym=DOM_FLIP.has(B.id)?alleleSyms(B)[1]:alleleSyms(B)[0];
        const d0=arr[0]===domSym,d1=arr[1]===domSym;
        if(d0&&!d1)return 0;
        if(d1&&!d0)return 1;
      }
    }
  }

/* 部分固缩率拆分：杂合雌性在"固缩率提升至 P%"下按概率分裂为两个确定表型的虚拟个体。
   显性所在 X 失活概率 = P + (1-P)/2（P% 提升 + 剩余随机的一半），另一条 = (1-P)/2。 */
function splitBarr(pop){
  if(!S.barr||S.sexSystem!=='XY'||!pop||!pop.length)return pop;
  const it=S.inter;
  if(!(it.enabled&&it.type==='xInact'&&it.locusA))return pop;
  const B=locusById(it.locusA);
  if(!B||B.group!=='simple'||B.def.inherit!=='X')return pop;
  const rateR=pctIn(it.xInactRate==null?100:it.xInactRate);/* 支持分数写法 */
  const rate=Math.max(0,Math.min(100,rNum(rateR)*100));
  if(rate<=0)return pop; /* 0% = 不促进，按随机失活（嵌合体）处理 */
  const r=pctIn(rate);
  const qDom=rAdd(r,rMul(rSub(rOne,r),R(1,2))); /* 显性所在X失活概率 */
  const qRec=rMul(rSub(rOne,r),R(1,2));          /* 另一条X失活概率 */
  const domSym=DOM_FLIP.has(B.id)?alleleSyms(B)[1]:alleleSyms(B)[0];
  const out=[];
  let split=false;
  pop.forEach(v=>{
    const arr=v.z.all[B.id]||[];
    if(v.z.sex==='F'&&arr.length===2&&arr[0]!==arr[1]){
      const d0=arr[0]===domSym,d1=arr[1]===domSym;
      if(d0!==d1){
        split=true;
        const di=d0?0:1;
        const base=v.p!=null?v.p:v.pn;
        const zA=Object.assign({},v.z,{barrForce:di}); /* 显性所在X固缩 */
        out.push({z:zA,p:rMul(base,qDom),pn:rMul(v.pn,qDom)});
        if(!rIs0(qRec)){
          const zB=Object.assign({},v.z,{barrForce:1-di});
          out.push({z:zB,p:rMul(base,qRec),pn:rMul(v.pn,qRec)});
        }
        return;
      }
    }
    out.push(v);
  });
  return split?out:pop;
}
function locusPhen(l,alleles,z){

    /* 等级框模型：从最高等级框向下找第一个命中的框；
       同框内携带多个不同等位 → 共显（同时表现）；否则表现该等位性状 */

      const hit=tier.alleles.filter(a=>alleles.includes(a.sym));
      if(!hit.length)continue;
      if(hit.length>1)return hit.map(h=>h.trait).join(' 与 ')+'（共显）';
      return hit[0].trait;
    }
    return alleles[0];
  }

  let dom=syms[0],rec=syms[1];
  /* 反推"显隐性未知"时支持翻转：小写对大写显性 */
  if(DOM_FLIP.has(l.id)&&l.def.mode==='complete'&&l.group==='simple'){dom=syms[1];rec=syms[0]}

  if(S.sexSystem!=='none'&&l.def.inherit!=='auto'){
    const isHet=(S.sexSystem==='XY'&&z&&z.sex==='M')||(S.sexSystem==='ZW'&&z&&z.sex==='F');
    if(isHet&&alleles.length===1)return alleles[0]===dom?l.def.dom:l.def.rec;
    if(S.barr&&S.sexSystem==='XY'&&z&&z.sex==='F'&&l.def.inherit!=='Y'&&het){
      let idx=z.barrForce!=null?z.barrForce:barrInactIdx(z); /* 概率拆分后的个体带确定失活条 */
      if(idx!=null){

      return'嵌合体：'+l.def.dom+' / '+l.def.rec+'（约各 1/2）';

    if(allRec)return l.def.rec;

    /* 从性遗传（如牛角/羊角）：杂合子表型随性别；纯合子两性相同 */
    if(allRec)return l.def.rec;
    if(het){
      if(!z||!z.sex)return l.def.dom; /* 未开启性染色体：退化为完全显性 */
      const maleDom=l.def.sexDomM!==false;
      const isM=z.sex==='M';
      return (isM===maleDom)?l.def.dom:l.def.rec;
    }
    return l.def.dom;
  }
  return hasDom?l.def.dom:l.def.rec;
}
function zygPhenotype(z){

    if(['complement','recessiveEpi','dominantEpi','inhibitor','duplicate','additive'].includes(it.type)){

      if(A&&B&&(z.all[A.id]||[]).length&&(z.all[B.id]||[]).length){
        const dA=hasDom(A),dB=hasDom(B);

          recessiveEpi:(dA&&dB)?it.traits[0]:(dA?it.traits[1]:it.traits[2]),
          dominantEpi:dA?it.traits[0]:(dB?it.traits[1]:it.traits[2]),

      }else interText=pw.final||'最终产物';

    }else if(it.type==='custom'){
      const cl=it.customLoci||[];
      if(cl.length&&cl.every(id=>(z.all[id]||[]).length)){
        const key=cl.map(id=>{const l=locusById(id);return id+'='+(hasDom(l)?'D':'r')}).join(',');

  const sig='S|'+popSig(pop);
  const hit=CALC.self.get(sig);
  if(hit){CALC.stat.hit++;return hit}
  CALC.stat.miss++;
  const map=new Map();
  pop.forEach(({z,p})=>{
    const eg=makeGametes(z,'F'),sp=makeGametes(z,'M');
    const r=doCross(eg.list,sp.list);
    r.zygs.forEach(v=>{
      const k=zKey(v.z);
      const e=map.get(k);
      if(e)e.p=rAdd(e.p,rMul(p,v.pn));
      else map.set(k,{z:v.z,p:rMul(p,v.pn)});
    });
  });
  let tot=rZero;map.forEach(e=>tot=rAdd(tot,e.p));
  const out=[];map.forEach(e=>{e.pn=rDiv(e.p,tot);out.push(e)});
  if(CALC.self.size<200)CALC.self.set(sig,out);
  return out;
}
function freePop(pop){
  const sig='F|'+popSig(pop);
  const hit=CALC.free.get(sig);
  if(hit){CALC.stat.hit++;return hit}
  CALC.stat.miss++;
  let eggs,sperm;
  if(S.sexSystem==='none'){
    eggs=popGametePool(pop,'F');sperm=popGametePool(pop,'M');
  }else{
    eggs=popGametePool(pop.filter(x=>x.z.sex==='F'),'F');
    sperm=popGametePool(pop.filter(x=>x.z.sex==='M'),'M');
    if(!eggs.length||!sperm.length)return[];
  }
  const out=doCross(eggs,sperm).zygs;
  if(CALC.free.size<200)CALC.free.set(sig,out);
  return out;
}

  rebuildLoci();

  if(M.mode==='self'&&S.sexSystem!=='none'){toast('涉及性染色体遗传时请使用"杂交"模式');return}

function phenoSummary(pop){
  const m=new Map();
  pop.forEach(v=>{
    const t=zygPhenotype(v.z);
    const k=zKey(v.z);
    const e=m.get(t);
    if(e){e.p=rAdd(e.p,v.pn);e.pn=e.p;if(k<e.firstKey)e.firstKey=k}
    else m.set(t,{t,p:v.pn,pn:v.pn,firstKey:k});
  });
  return[...m.values()].sort((a,b)=>a.firstKey<b.firstKey?-1:a.firstKey>b.firstKey?1:0);
}
function genoSummary(pop){
  const m=new Map();
  pop.forEach(v=>{
    const k=zKey(v.z);
    const e=m.get(k);
    if(e){e.p=rAdd(e.p,v.pn);e.pn=e.p}else m.set(k,{z:v.z,p:v.pn,pn:v.pn});
  });
  return[...m.values()].sort((a,b)=>zKey(a.z)<zKey(b.z)?-1:zKey(a.z)>zKey(b.z)?1:0);
}

let GEN_CACHE=new Map();
function genData(g){
  if(!g)return null;

/* 配子形成过程分析（连锁/自由组合/多拷贝），仿试题标准答案的分步写法 */
function gameteAnalysis(g,who,parent){
  const out=[];
  if(!parent)return out;
  let units=[];
  try{units=buildUnits()}catch(e){return out}
  units.forEach((u,i)=>{
    if(u.kind==='sex'){
      const ids=[...new Set(u.xl.concat(u.yl))];
      if(!ids.length)return;
      const nm=ids.map(id=>chromLocusName(locusById(id))).join('、');
      out.push('        · 性染色体上的基因（'+nm+'）：'+((S.sexSystem==='XY')?'♂产生 X、Y 两种配子（各 1/2，伴 X 基因呈半合子）':'♀产生 Z、W 两种配子（各 1/2，伴 Z 基因呈半合子）'));
      return;
    }
    const ids=u.loci||[];
    if(!ids.length)return;
    (u.recWarn||[]).forEach(w=>{if(notes.indexOf(w)<0)notes.push('⚠ '+w)});
    const names=ids.map(id=>chromLocusName(locusById(id)));
    const label=u.pair>=0?('第'+(u.pair+1)+'对染色体'):'独立分配的染色体';
    if(ids.length===1){
      const l=locusById(ids[0]);
      const a=(parent.all&&parent.all[ids[0]])?parent.all[ids[0]].filter(x=>x!=null):[];
      const uniq=[...new Set(a)];
      out.push('        · '+label+'（'+names[0]+' 基因座）：亲本基因型 '+uniq.join('/')+' → 产生 '+
        uniq.map(s=>s).join('、')+' 两种配子，各占 1/2');
      return;
    }
    const recs=(u.rec||[]).map(x=>rPct(x)).join('%、');
    const at50=(u.rec||[]).every(x=>Math.abs(rNum(x)-50)<1e-9);
    out.push('        · '+label+'（'+names.join('、')+' 连锁）：'+(at50?
      '交换值 '+recs+'（≥50%，等同自由组合）→ 按自由组合处理，共 2^'+ids.length+' 种配子':
      '交换值 '+recs+' → 亲本型配子各 (1−r)/2，重组型配子各 r/2'));
  });
  if(units.some(u=>u.ploidy>2)){
    out.push('        · 存在多拷贝染色体（三体等）：按"'+((S.chrom.simple&&S.chrom.simple.triMode)==='to21'?'n:1 交替式':'独立分配')+'"产生 n+1 与 n 两类配子'+(String(S.chrom.simple&&S.chrom.simple.nullG)==='dead'?'，进入 0 条的配子视为致死':'，进入 0 条的配子记为 O'));
  }
  if(!out.length)out.push('        · 各基因独立分配（自由组合）');
  return out;
}
