<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>遗传学多功能计算器</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#ffffff;--text:#1c2128;--muted:#6b7280;--line:#e4e7ec;
  --accent:#4f6ef7;--accent-soft:#eef1fe;--danger:#dc2626;--ok:#059669;
  --chip:#eef1fe;--shadow:0 1px 3px rgba(16,24,40,.08);--svg-bg:#fafbfc;
}
[data-theme="dark"]{
  --bg:#0f1318;--panel:#181e26;--text:#e6e9ee;--muted:#98a2b3;--line:#2a3340;
  --accent:#7c93ff;--accent-soft:#232c3a;--danger:#f87171;--ok:#34d399;
  --chip:#232c3a;--shadow:0 1px 3px rgba(0,0,0,.4);--svg-bg:#141a21;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.65 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
header .title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
header .title .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4f6ef7,#9333ea);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
header .tools{display:flex;gap:8px}
.tabs{display:none;position:sticky;top:53px;z-index:49;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;gap:8px}
.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;font-size:14px}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.app{display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;max-width:1440px;margin:0 auto;padding:14px}
@media(max-width:960px){
  .app{grid-template-columns:1fr;padding:10px}
  .tabs{display:flex}
  .config.hide{display:none}
  .results{display:none}
  .results.show{display:block}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow)}
details.panel{padding:0 14px}
details.panel summary{cursor:pointer;font-weight:650;padding:12px 0;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::before{content:"▸";transition:.15s;color:var(--muted)}
details.panel[open] summary::before{transform:rotate(90deg)}
details.panel .body{padding:2px 0 14px}
.pad{padding:14px}
h4.sec{margin:14px 0 6px;font-size:13.5px;color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin:4px 0;line-height:1.6}
.warn{font-size:12px;color:var(--danger)}
label.fl{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:13.5px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;vertical-align:-2px}
button.btn{padding:7px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:13.5px;cursor:pointer}
button.btn.ghost{background:var(--accent-soft);color:var(--accent)}
button.btn.mini{padding:3px 8px;font-size:12px;border-radius:6px}
button.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.card .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;cursor:pointer;user-select:none}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.dead{opacity:.35;cursor:not-allowed}
.chip .ord{font-size:10px;color:var(--muted)}
.chip.sel .ord{color:#dfe6ff}
.addbtn{border:1px dashed var(--line);background:transparent;color:var(--accent);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12.5px}
/* 染色体编辑器 */
.chromwrap{background:var(--svg-bg);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto;margin:8px 0}
.chromwrap svg{display:block;margin:0 auto}
.slotline{cursor:pointer}
.slotline:hover{filter:brightness(.85)}
.placeLbl{font-size:12px;cursor:pointer}
/* 遗传图解 */
.diagram{padding:6px 4px}
.gen-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin:6px 0}
.gen-tag{writing-mode:vertical-lr;text-orientation:upright;letter-spacing:2px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 5px;cursor:pointer;border:none;font-size:13px}
.geno-box{border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--bg);min-width:110px;text-align:center}
.geno-box .g{font-weight:700;font-size:15px;letter-spacing:1px}
.geno-box .p{font-size:12px;color:var(--muted)}
.geno-box .r{font-size:12px;color:var(--accent);font-weight:600}
.geno-box.dead{opacity:.55;text-decoration:line-through}
.gamete-list{font-size:12.5px;color:var(--muted);padding:2px 8px}
.arrowline{text-align:center;color:var(--muted);font-size:16px;margin:-2px 0}
table.rtab{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.rtab th,table.rtab td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.rtab th{background:var(--accent-soft);font-weight:600}
/* 模态框 */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
@media(min-width:700px){.modal{align-items:center;padding:24px}}
.modal .box{background:var(--panel);border-radius:16px 16px 0 0;max-width:860px;width:100%;max-height:88vh;display:flex;flex-direction:column}
@media(min-width:700px){.modal .box{border-radius:16px}}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal .mbody{padding:14px 18px;overflow-y:auto}
.modal .x{border:none;background:var(--bg);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.steps{font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:12.8px;white-space:pre-wrap;line-height:1.9;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.big{font-size:16px;font-weight:700}
.center{text-align:center}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.runbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 30px}
.pill-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content}
.pill-toggle button{border:none;background:transparent;color:var(--text);padding:6px 14px;cursor:pointer;font-size:13px}
.pill-toggle button.active{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <div class="title"><span class="logo">🧬</span>遗传学多功能计算器 <span style="font-size:11px;color:var(--muted);font-weight:400">复等位 · 连锁 · 致死 · 互作 · 伴性 · 细胞质 · 反推</span></div>
  <div class="tools"><button class="btn ghost" id="themeBtn">🌙 深色</button></div>
</header>
<nav class="tabs">
  <button data-tab="config" class="active">📝 题目设置</button>
  <button data-tab="results">📊 计算结果</button>
</nav>
<div class="app">
  <aside class="config" id="configPanel"></aside>
  <main class="results" id="resultPanel">
    <section class="panel pad" id="runPanel"></section>
    <section class="panel pad" id="diagramPanel">
      <div class="hint" style="margin:0">尚未计算。请在上方完成题目设置与亲本设置后，点击「开始计算」生成遗传图解。</div>
    </section>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="box">
    <div class="mhead"><span id="mTitle"></span><button class="x" id="mClose">✕</button></div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>
<footer>遗传学多功能计算器 · 单文件离线运行 · 供学习演算使用 · 版本 <b id="ver">v2.5</b>（2026-08-23 反推自动更新版）</footer>
<script>


/* ================= 工具函数 ================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function lcm(a,b){return a/gcd(a,b)*b}
function R(n,d){if(d===undefined)d=1;if(d<0){n=-n;d=-d}const g=gcd(Math.round(n),Math.round(d));return{n:Math.round(n)/g,d:Math.round(d)/g}}
const rAdd=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d);
const rSub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d);
const rMul=(a,b)=>R(a.n*b.n,a.d*b.d);
const rZero=R(0),rOne=R(1);
const rNum=a=>a.n/a.d;
const rIs0=a=>a.n===0;
const rEq=(a,b)=>a.n===b.n&&a.d===b.d;
function rStr(a){return a.d===1?String(a.n):a.n+'/'+a.d}
function rPct(a){const v=rNum(a)*100;return (Math.round(v*1000)/1000)+'%'}
function pctIn(v){/* 输入百分比数值(如20表示20%) -> 精确分数 */
  const x=Number(v)||0;return R(Math.round(x*1000),100000)}
function ratioStr(rs){
  if(!rs.length)return'';
  const L=rs.reduce((a,r)=>lcm(a,r.d),1);
  const ns=rs.map(r=>r.n*L/r.d);
  if(ns.every(Number.isInteger)){
    const g=ns.reduce((a,b)=>gcd(a,b));
    const m=ns.map(n=>n/g);
    if(m.every(x=>x>0)&&Math.max(...m)<=2000000)return m.join(' : ');
  }
  return rs.map(rStr).join(' : ');
}
function el(tag,attrs){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    if(k==='class')e.className=attrs[k];
    else if(k==='html')e.innerHTML=attrs[k];
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==null&&attrs[k]!==undefined)e.setAttribute(k,attrs[k]);
  }
  for(let i=2;i<arguments.length;i++){const kid=arguments[i];if(kid==null)continue;e.append(kid.nodeType?kid:document.createTextNode(kid))}
  return e;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function sup(s){/* 把 IA 显示为 I<sup>A</sup>：末位小写字母转上标 */
  return esc(s);
}
/* ================= 全局状态 ================= */
function chromDef(){return{pairs:2,ploidy:{},placed:[],rec:{},triMode:'indep',nullG:'dead'}}
function freshState(){return{
  simpleCount:1,
  simple:[defSimple(0)],
  multiCount:0,multi:[],
  cytoCount:0,cyto:[],
  sexEnabled:false,sexSystem:'none',barr:false,
  chrom:{simple:chromDef(),multi:chromDef(),cyto:chromDef()},
  gLethal:{enabled:false,rules:[]},
  zLethal:{enabled:false,rules:[]},
  inter:{enabled:false,type:'complement',locusA:'',locusB:'',traits:['性状一','性状二','性状三','性状四'],addLoci:[],pathway:{steps:[],final:'最终产物'},custom:{}},
  generations:2,
  calcMode:'fwd',      /* 计算子栏目：fwd 正推 / rev 反推 */
  removals:[],         /* 剔除性状规则：{gen,name} 从第gen代起剔除该表型个体后继续交配 */
  rev:{firstMode:'cross',nextMode:'self',
    genes:[{letter:'A',dom:'',rec:''}],  /* 反推独立基因设置：字母必填，性状注释选填 */
    phenList:'',                        /* 表型清单：如"紫,绿,白" */
    trySex:true,tryLethal:false,tryInter:false,pure:false,     /* 推断范围：伴性/致死/互作/亲本纯合 */
    pw:{enabled:false,nodes:[{id:1,name:'前体物质',x:80,y:120},{id:2,name:'产物1',x:240,y:120},{id:3,name:'产物2',x:400,y:120}],nextId:4,reactions:[],inhibitions:[]},
    p1Phen:{},p2Phen:{},obs:[{gen:2,ratio:''}],domUnknown:false,result:null},
  mating:{mode:'cross',p1:null,p2:null,ratio:[1,1]}
}}
function defSimple(i){return{letter:LETTERS[i]||'X',dom:'显性性状',rec:'隐性性状',mid:'中间性状',mode:'complete',inherit:'auto',maternal:false}}
function defMulti(i){return{letter:'I',tiers:[
  {cls:'dom',alleles:[{sym:'I1',trait:'性状1'}]},
  {cls:'dom',alleles:[{sym:'I2',trait:'性状2'}]},
  {cls:'rec',alleles:[{sym:'i',trait:'性状3'}]}
]}}
/* 旧数据(alleles数组)自动迁移为等级框结构 */
function normMulti(L){
  if(L.tiers)return L;
  const tiers=[];
  const arr=L.alleles||[{sym:'I1',trait:'性状1'},{sym:'I2',trait:'性状2'},{sym:'i',trait:'性状3'}];
  arr.forEach((a,k)=>{
    if(k===0&&L.codomPair&&arr.length>1){
      tiers.push({cls:'dom',alleles:[a]});
    }else if(k===1&&L.codomPair){
      tiers[0].alleles.push(a);
    }else{
      tiers.push({cls:k===arr.length-1?'rec':'dom',alleles:[a]});
    }
  });
  delete L.codomPair;
  L.tiers=tiers;
  return L;
}
function defCyto(i){return{letter:'L',variants:[{sym:'N',trait:'正常型'},{sym:'S',trait:'突变型'}]}}
let S=freshState();
let LOC=[];           // 全部基因座注册表
let selectedChip=null;// 染色体编辑器当前选中的基因
let lastResult=null;  // 最近一次计算结果
let revStale=false;    // 反推输入已修改但未重新反推
/* 重建基因座注册表 */
function rebuildLoci(){
  LOC=[];
  S.simple.length=Math.max(0,S.simpleCount|0);
  for(let i=0;i<S.simpleCount;i++)if(!S.simple[i])S.simple[i]=defSimple(i);
  S.simple.forEach((L,i)=>LOC.push({id:'n'+i,group:'simple',idx:i,letter:L.letter||LETTERS[i]||'G',def:L}));
  S.multi.length=Math.max(0,S.multiCount|0);
  for(let i=0;i<S.multiCount;i++)if(!S.multi[i])S.multi[i]=defMulti(i);
  S.multi.forEach((L,i)=>LOC.push({id:'m'+i,group:'multi',idx:i,letter:L.letter||'I',def:L}));
  S.cyto.length=Math.max(0,S.cytoCount|0);
  for(let i=0;i<S.cytoCount;i++)if(!S.cyto[i])S.cyto[i]=defCyto(i);
  S.cyto.forEach((L,i)=>LOC.push({id:'c'+i,group:'cyto',idx:i,letter:L.letter||'L',def:L}));
  /* 默认规则：各栏目染色体对数 = 该栏目基因（座）数（每对基因一对染色体，独立遗传）；
     用户手动修改过对数后（pairsAuto=false）则尊重其设置 */
  ['simple','multi','cyto'].forEach(g=>{
    const ch=S.chrom[g];
    const n=LOC.filter(l=>l.group===g&&!(l.group==='simple'&&l.def.inherit!=='auto')).length;
    if(ch.pairsAuto!==false)ch.pairs=Math.max(1,Math.min(6,n));
  });
}
function locusById(id){return LOC.find(l=>l.id===id)}
function alleleSyms(l){ // 某基因座全部可选等位基因符号（multi 按等级框顺序展平：高显性在前）
  if(l.group==='simple'){const c=l.def.letter||'A';return[c,c.toLowerCase()]}
  if(l.group==='multi'){normMulti(l.def);return[].concat(...l.def.tiers.map(t=>t.alleles.map(a=>a.sym)))}
  return l.def.variants.map(v=>v.sym);
}
function traitOf(l,sym){
  if(l.group==='multi'){normMulti(l.def);const t=l.def.tiers.find(t=>t.alleles.some(a=>a.sym===sym));const a=t&&t.alleles.find(a=>a.sym===sym);return a?a.trait:sym}
  if(l.group==='cyto'){const v=l.def.variants.find(x=>x.sym===sym);return v?v.trait:sym}
  return null;
}
function domSym(l){const s=alleleSyms(l);return s[0]}
/* 主题 */
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='dark'?'☀️ 浅色':'🌙 深色';themeBtn.dataset.t=t}
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
/* 移动端切换 */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
/* 模态框 */
const modal=document.getElementById('modal');
document.getElementById('mClose').onclick=()=>modal.hidden=true;
modal.onclick=e=>{if(e.target===modal)modal.hidden=true};
function openModal(title,node){document.getElementById('mTitle').textContent=title;const b=document.getElementById('mBody');b.innerHTML='';b.append(node);modal.hidden=false}
/* ================= 左侧配置面板 ================= */
function txtIn(v,cb){const i=el('input',{type:'text',value:v==null?'':v});i.oninput=()=>cb(i.value.trim());return i}
function numIn(v,min,max,cb){const i=el('input',{type:'number',value:v,min:min,max:max});i.onchange=()=>{let x=parseInt(i.value);if(isNaN(x))x=min;x=Math.max(min,Math.min(max,x));i.value=x;cb(x)};return i}
function numInF(v,cb){const i=el('input',{type:'number',value:v==null?'':v,step:'any'});i.oninput=()=>cb(parseFloat(i.value)||0);return i}
function pctInEl(v,cb){const i=el('input',{type:'number',value:v,min:0,max:100,step:'0.001'});i.oninput=()=>cb(i.value);return i}
function selIn(v,opts,cb){const s=el('select');opts.forEach(o=>{const op=el('option',{value:o[0]},o[1]);if(o[0]===v)op.selected=true;s.append(op)});s.onchange=()=>cb(s.value);return s}
function chkIn(v,cb,label){const l=el('label',{class:'row'});const i=el('input',{type:'checkbox'});i.checked=!!v;i.onchange=()=>cb(i.checked);l.append(i,el('span',{html:label||''}));return l}
function simpleLoci(){return LOC.filter(l=>l.group==='simple')}
function flRow(label,...ctrls){const w=el('div');w.append(el('label',{class:'fl'},label));const r=el('div',{class:'row'});ctrls.forEach(c=>r.append(c));w.append(r);return w}
const PANEL_OPEN={};let pendingScroll=null;
function panel(title,body,open){
  const d=el('details',{class:'panel'});
  if(PANEL_OPEN[title]!=null?PANEL_OPEN[title]:!!open)d.open=true;
  d.addEventListener('toggle',()=>{PANEL_OPEN[title]=d.open});
  d.append(el('summary',null,title));
  const b=el('div',{class:'body'});b.append(body);d.append(b);return d;
}
function helpPanel(){
  const b=el('div');
  b.append(el('div',{class:'hint',html:
   '本计算器通过下列栏目"拼装"出题目条件，再在右侧设置亲本并计算遗传图解。<br>'+
   '• <b>交换值(重组率)</b>：两对基因之间<em>重组型配子</em>占该对基因全部配子的百分率，记作 r。r=50% 时表现为自由组合；r 越小连锁越紧密。<br>'+
   '• <b>相引/相斥</b>：由亲本在染色体上放置显性或隐性基因的位置自动决定（如 AB/ab 为相引，Ab/aB 为相斥）。<br>'+
   '• <b>配子致死</b>：某类配子按死亡率失活，剩余配子概率重新归一化。<br>'+
   '• <b>合子致死</b>：某类合子按死亡率死亡，后代比例按存活个体重新归一化（如 Aa 自交 → 2:1）。<br>'+
   '• 多代计算(自交/自由交配)采用逐代迭代法（等价于马尔可夫链转移矩阵的连乘）。'}));

/* 致死条件编辑（配子/合子共用） */
function condRowEditor(rule,scope,rerender){
  const box=el('div');
  function draw(){
    box.innerHTML='';
    if(!LOC.length){box.append(el('div',{class:'warn'},'请先在上方设置基因，再添加致死条件。'));return}
    rule.conds.forEach((c,k)=>{
      let l=locusById(c.locus);
      if(!l){l=LOC[0];c.locus=l.id}
      if(!alleleSyms(l).includes(c.allele))c.allele=alleleSyms(l)[0];
      const row=el('div',{class:'row'});
      row.append(el('span',{class:'badge'},'条件'+(k+1)));
      row.append(selIn(c.locus,LOC.map(x=>[x.id,(x.group==='simple'?x.letter:x.def.letter)+'('+(x.group==='simple'?'核':x.group==='multi'?'复等位':'细胞质')+')']),
        v=>{c.locus=v;c.allele=alleleSyms(locusById(v))[0];draw()}));
      row.append(selIn(c.allele,alleleSyms(l).map(s=>[s,s]),v=>c.allele=v));
      const types=scope==='gamete'?[['has','含有'],['nothas','不含']]:[['has','含有'],['nothas','不含'],['hom','纯合(该等位)'],['het','杂合']];
      row.append(selIn(c.type,types,v=>c.type=v));
      row.append(el('button',{class:'btn mini danger',onclick:()=>{rule.conds.splice(k,1);draw()}},'删'));
      box.append(row);
    });
    box.append(el('button',{class:'addbtn',onclick:()=>{rule.conds.push({locus:LOC[0].id,allele:alleleSyms(LOC[0])[0],type:'has'});draw()}},'+ 添加条件'));
  }
  draw();return box;
}

/* 基因互作 */
const INTER_TYPES=[
  ['complement','互补作用（A_B_ 才表达 → 9:7）'],
  ['recessiveEpi','隐性上位（aa 掩盖 B/b → 9:3:4）'],
  ['dominantEpi','显性上位（A_ 掩盖 B/b → 12:3:1）'],
  ['inhibitor','抑制作用（A_ 抑制 B 表达 → 13:3）'],
  ['duplicate','重叠作用（任一显性即表现 → 15:1）'],
  ['additive','积加作用（A_B_ / A_bb+aaB_ / aabb → 9:6:1）'],
  ['polygenic','累加效应（数量性状，显性基因个数分级 → 1:4:6:4:1）'],
  ['pathway','基因通路（代谢途径 A→B→C 流程编辑，含抑制分支）'],
  ['xInact','促进X固缩（显性使其所在的X优先失活为巴氏小体）'],
  ['custom','自定义表型组合表（手动指定各基因型类的表型）']
];
function interPanel(){
  const b=el('div');
  const it=S.inter;
  b.append(chkIn(it.enabled,v=>{it.enabled=v;renderConfig()},'启用基因互作'));
  if(!it.enabled)return panel('🧩 基因互作',b);
  b.append(flRow('互作类型',selIn(it.type,INTER_TYPES,v=>{it.type=v;renderConfig()})));
  const sl=simpleLoci();
  if(!sl.length){b.append(el('div',{class:'warn'},'基因互作需要至少一对核遗传二等位基因，请先在上方设置。'));}
  if(['complement','recessiveEpi','dominantEpi','inhibitor','duplicate','additive'].includes(it.type)){
    if(!it.locusA&&sl[0])it.locusA=sl[0].id;
    if(!it.locusB&&sl[1])it.locusB=sl[1]?sl[1].id:sl[0].id;
    b.append(el('div',{class:'grid2'},
      flRow('基因座 甲',selIn(it.locusA,sl.map(l=>[l.id,l.letter]),v=>it.locusA=v)),
      flRow('基因座 乙',selIn(it.locusB,sl.map(l=>[l.id,l.letter]),v=>it.locusB=v))));
    const n={complement:2,recessiveEpi:3,dominantEpi:3,inhibitor:2,duplicate:2,additive:3}[it.type];
    b.append(el('div',{class:'hint',html:{
      complement:'A_B_ → 表型一；其余(有任一隐性纯合) → 表型二。经典比例 <b>9:7</b>',
      recessiveEpi:'A_B_ → 表型一；A_bb → 表型二；aa__(隐性纯合上位) → 表型三。经典比例 <b>9:3:4</b>',
      dominantEpi:'A__ → 表型一(显性上位)；aaB_ → 表型二；aabb → 表型三。经典比例 <b>12:3:1</b>',
      inhibitor:'A_ 存在时抑制 B 基因表达 → A_B_、A_bb、aabb 均为表型一；仅 aaB_ 为表型二。经典比例 <b>13:3</b>',
      duplicate:'只要任一基因存在显性即为表型一，仅双隐性纯合为表型二。经典比例 <b>15:1</b>',
      additive:'A_B_ 为表型一；A_bb 与 aaB_ 合并为表型二；aabb 为表型三。经典比例 <b>9:6:1</b>'
    }[it.type]}));
    for(let i=0;i<n;i++)b.append(flRow('表型'+(i+1)+'名称',txtIn(it.traits[i]||('表型'+(i+1)),v=>it.traits[i]=v)));
  }
  if(it.type==='polygenic'){
    b.append(el('div',{class:'hint',html:'累加效应(多基因/数量性状)：每个显性等位基因累加一份效应，n 对基因共 2n+1 级，呈连续表型（钟形分布）。两对基因 F₂ 比例 <b>1:4:6:4:1</b>，三对为 <b>1:6:15:20:15:6:1</b>。请勾选参与的基因座：'}));
    const row=el('div',{class:'row'});

      row.append(c);
    });
    b.append(row);
    if(!it.addLoci.length)b.append(el('div',{class:'warn'},'请至少勾选一个基因座'));
    b.append(el('div',{class:'mt'},chkIn(it.pgVal,v=>{it.pgVal=v;renderConfig()},'启用<b>连续数值表型</b>（数量性状：表型值 = 基础值 + 显性等位数 × 增量）')));
    if(it.pgVal){

        flRow('性状名称',txtIn(it.pgName==null?'株高':it.pgName,v=>it.pgName=v)),
        flRow('单位',txtIn(it.pgUnit==null?'cm':it.pgUnit,v=>it.pgUnit=v))));

        flRow('基础表型值（0 个显性时）',numInF(it.pgBase==null?150:it.pgBase,v=>it.pgBase=v)),

    }

    const pw=it.pathway;
    if(!pw.steps.length&&sl[0]){pw.steps.push({locus:sl[0].id,blocked:'白色(底物)'});if(sl[1])pw.steps.push({locus:sl[1].id,blocked:''});pw.final='红色色素'}
    pw.steps.forEach((st,k)=>{
      const card=el('div',{class:'card'});
      card.append(el('div',{class:'chead'},'第 '+(k+1)+' 步',

/* 改名迁移：基因字母/等位符号改变时，同步更新所有引用旧符号的地方（染色体图放置、亲本基因型、致死条件），避免新旧名称混淆 */
function migrateAlleleSym(group,idx,oldSym,newSym){
  if(!oldSym||!newSym||oldSym===newSym)return;
  const id=(group==='simple'?'n':group==='multi'?'m':'c')+idx;
  const ch=S.chrom[group];
  if(ch)ch.placed.forEach(pl=>{if(pl.locus===id&&pl.sym===oldSym)pl.sym=newSym});
  [S.mating.p1,S.mating.p2].forEach(p=>{
    if(!p)return;
    if(p.all&&p.all[id])p.all[id]=p.all[id].map(s=>s===oldSym?newSym:s);
    if(p.cyto&&p.cyto[id]===oldSym)p.cyto[id]=newSym;
  });
  [S.gLethal,S.zLethal].forEach(st=>{if(st.rules)st.rules.forEach(r=>{if(r.conds)r.conds.forEach(c=>{if(c.locus===id&&c.allele===oldSym)c.allele=newSym})})});
}

function buildChromEditor(g){
  const ch=S.chrom[g];
  const ls=groupLoci(g).filter(l=>!(l.group==='simple'&&l.def.inherit!=='auto'));
  const wrap=el('div');
  const ctl=el('div',{class:'row'});
  ctl.append(el('span',{class:'hint'},'染色体对数（默认=基因数，即每对基因一对染色体）'));
  ctl.append(numIn(ch.pairs,1,6,v=>{ch.pairs=v;ch.pairsAuto=false;renderConfig()}));
  wrap.append(ctl);
  const chipRow=el('div',{class:'row'});
  chipRow.append(el('span',{class:'hint'},'等位基因：'));
  ls.forEach(l=>{
    alleleSyms(l).forEach(sym=>{

    });
  });
  if(ls.length<groupLoci(g).length)chipRow.append(el('span',{class:'hint'},'（伴性基因不参与常染色体图）'));
  wrap.append(chipRow);
  wrap.append(el('div',{class:'hint',html:'点击选中某个<b>等位基因</b>（如 A 或 a），再点击染色体横线放置。把 A、a 分别放到同一对的两条同源染色体上即可定义相引（AB/ab）或相斥（Ab/aB）。'}));
  wrap.append(drawChromSVG(g,ls));
  for(let p=0;p<ch.pairs;p++){
    const row=el('div',{class:'row'});
    row.append(el('span',{class:'badge'},'第'+(p+1)+'对'));
    row.append(el('span',{class:'hint'},'染色体条数'));
    row.append(selIn(ch.ploidy[p]||2,[[2,'2（正常）'],[3,'3（三体）'],[4,'4（四体）']],v=>{ch.ploidy[p]=+v;S.mating.p1=S.mating.p2=null;renderConfig()}));
    const placed=ch.placed.filter(x=>x.pair===p&&x.col!=null&&x.sym!=null&&ls.some(l=>l.id===x.locus));
    const seenL=new Set(),dedup=[];
    placed.slice().sort((a,b)=>a.slot-b.slot).forEach(x=>{if(!seenL.has(x.locus)){seenL.add(x.locus);dedup.push(x)}});
    if(!ch.rec[p])ch.rec[p]=[];
    for(let k=0;k<dedup.length-1;k++){
      const A=locusById(dedup[k].locus),B=locusById(dedup[k+1].locus);
      const nm=x=>x?(x.group==='simple'?x.letter:x.def.letter):'?';
      const v=(ch.rec[p][k]==null||ch.rec[p][k]==='')?50:ch.rec[p][k];
      row.append(el('span',{class:'hint'},nm(A)+'—'+nm(B)));
      const inp=el('input',{type:'number',value:v,min:0,max:50,step:'0.001',style:'width:64px'});
      inp.oninput=()=>{ch.rec[p][k]=parseFloat(inp.value)};
      row.append(inp);
      row.append(el('span',{class:'hint'},'%'));
    }
    wrap.append(row);
  }
  if(Object.values(ch.ploidy).some(m=>m>2)){
    wrap.append(flRow('多拷贝染色体分配方式',selIn(ch.triMode||'indep',[
      ['indep','独立分配：每条染色体各自 50% 概率进入配子'],
      ['to21','n:1 交替式：只产生两类互补配子（如三体 AA/A 各 1/2）']
    ],v=>ch.triMode=v)));
    wrap.append(flRow('进入 0 条的配子',selIn(ch.nullG||'dead',[['dead','视为致死（剔除后归一化）'],['alive','存活（缺体配子，显示为 O）']],v=>ch.nullG=v)));
  }
  if(g==='cyto')wrap.append(el('div',{class:'hint'},'注：细胞质基因实际随母本细胞质整体传递（恒为母系遗传），本图仅作位置标注。'));
  return wrap;
}
function drawChromSVG(g,ls){
  const ch=S.chrom[g];
  const slots=Math.max(1,ls.length);
  const H=36+slots*22;
  let maxM=2;for(let p=0;p<ch.pairs;p++)maxM=Math.max(maxM,ch.ploidy[p]||2);
  const SP=22;               /* 同源染色体间距 */
  const colW=Math.max(100,maxM*SP+64);
  const W=Math.max(190,24+ch.pairs*colW);
  const Ht=H+46;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',W);svg.setAttribute('height',Ht);
  svg.setAttribute('viewBox','0 0 '+W+' '+Ht);
  svg.style.color='var(--text)';
  const mk=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e};
  svg.append(mk('circle',{cx:W/2,cy:Ht/2,r:Math.sqrt((W/2+4)*(W/2+4)+(Ht/2+4)*(Ht/2+4)),fill:'none',stroke:'currentColor','stroke-width':1.2,opacity:.45}));
  const yTop=12;
  for(let p=0;p<ch.pairs;p++){
    const m=ch.ploidy[p]||2;
    const xc=24+colW*p+colW/2;
    const color=PAIR_COLORS[p%PAIR_COLORS.length];
    for(let c=0;c<m;c++){
      const x=xc-(m-1)*SP/2+c*SP;
      svg.append(mk('line',{x1:x,y1:yTop,x2:x,y2:yTop+H,stroke:color,'stroke-width':3,'stroke-linecap':'round',opacity:.9}));
      svg.append(mk('circle',{cx:x,cy:yTop+H/2,r:2.6,fill:color}));
      for(let k=0;k<slots;k++){
        const y=yTop+(k+0.7)*(H/slots);
        const placedHere=ch.placed.find(pl=>pl.pair===p&&pl.col===c&&pl.slot===k&&pl.col!=null&&pl.sym!=null);
        svg.append(mk('line',{x1:x-11,y1:y,x2:x+11,y2:y,stroke:color,'stroke-width':1.4,opacity:.8}));
        if(placedHere){
          /* 字母放在竖线左侧，紧贴竖线不重叠 */
          const txt=mk('text',{x:x-4,y:y+3.5,'text-anchor':'end','font-size':10.5,'font-weight':700,fill:color,cursor:'pointer'});
          txt.textContent=placedHere.sym;
          txt.addEventListener('click',ev=>{
            ev.stopPropagation();
            ch.placed=ch.placed.filter(pl=>!(pl.pair===p&&pl.col===c&&pl.slot===k));
            renderConfig();
          });
          svg.append(txt);
        }
        const hit=mk('rect',{x:x-12,y:y-9,width:34,height:18,fill:'transparent',cursor:'pointer'});
        hit.addEventListener('click',()=>{
          const ex=ch.placed.find(pl=>pl.pair===p&&pl.col===c&&pl.slot===k);
          if(ex){ch.placed=ch.placed.filter(pl=>!(pl.pair===p&&pl.col===c&&pl.slot===k));renderConfig();return}
          if(!selectedChip){toast('请先点击上方等位基因标签（如 A 或 a）选中，再点击染色体上的横线');return}
          const sep=selectedChip.indexOf('|');
          const locusId=selectedChip.slice(0,sep),sym=selectedChip.slice(sep+1);
          ch.placed.push({pair:p,col:c,slot:k,locus:locusId,sym});
          renderConfig();
          const l=locusById(locusId);
          const box=el('div');
          box.append(el('div',{style:'font-size:15px;margin-bottom:6px'},'✅ 放置成功！'));
          box.append(el('div',{class:'hint',html:'等位基因 <b>'+esc(sym)+'</b> 已放置到 <b>第'+(p+1)+'对染色体</b>（'+(m>2?m+' 条中的第'+(c+1)+'条':'同源染色体第'+(c+1)+'条')+'，第'+(k+1)+'个基因位点）。<br>提示：可将它的等位基因（'+esc(alleleSyms(l).filter(s=>s!==sym).join('、'))+'）放到同对的另一条染色体上，以构成相引或相斥；同一对染色体上的基因之间即连锁，可在下方设置交换值。'}));
          box.append(el('div',{class:'row mt'},
            el('button',{class:'btn ghost',onclick:()=>{ch.placed=ch.placed.filter(pl=>!(pl.pair===p&&pl.col===c&&pl.slot===k));modal.hidden=true;renderConfig()}},'↩ 撤销本次放置'),
            el('button',{class:'btn',onclick:()=>{modal.hidden=true}},'继续')));
          openModal('染色体图 · 放置成功',box);
        });
        svg.append(hit);
      }
    }
    const lb=mk('text',{x:xc,y:yTop+H+16,'text-anchor':'middle','font-size':10.5,fill:'currentColor',opacity:.75});
    lb.textContent='第'+(p+1)+'对'+(m>2?'（'+m+'条）':'');
    svg.append(lb);
  }
  return el('div',{class:'chromwrap'},svg);
}

function ploidyOfLocus(l){
  if(l.group==='cyto')return 1;
  const ch=S.chrom[l.group];
  const pl=ch.placed.find(p=>p.locus===l.id);
  if(pl)return ch.ploidy[pl.pair]||2;
  return 2;
}
function sexCopies(inh,sexRole){
  const isHet=(S.sexSystem==='XY')?(sexRole==='M'):(sexRole==='F');
  if(inh==='X')return isHet?1:2;
  if(inh==='Y')return isHet?1:0;
  return 2;
}
function defaultAlleles(l,sexRole){
  const syms=alleleSyms(l);
  if(l.group==='simple'&&S.sexSystem!=='none'&&l.def.inherit!=='auto'){
    const copies=sexCopies(l.def.inherit,sexRole);
    const arr=[];for(let i=0;i<copies;i++)arr.push(i===0?syms[0]:syms[1]);
    return arr;
  }
  if(l.group==='cyto')return[syms[0]];
  const m=ploidyOfLocus(l);
  const arr=[];for(let i=0;i<m;i++)arr.push(i===0?syms[0]:(m===2?syms[syms.length-1]:syms[0]));
  if(m>2)arr[m-1]=syms[syms.length-1];
  return arr;
}
function defaultParent(sexRole){
  const p={all:{},cyto:{},sex:(sexRole==='F')?'F':'M'};
  LOC.forEach(l=>{
    if(l.group==='cyto'){p.cyto[l.id]=alleleSyms(l)[0];return}
    p.all[l.id]=defaultAlleles(l,sexRole);
  });
  return p;
}

      const hyp={genes,inh,let:letv,flip,inter:'pw',pw:{nodes:pw.nodes,reactions:pw.reactions,inhibitions:pw.inhibitions},swap:false,assign:null};
      const isSex=hyp.inh.some(x=>x!=='auto');

      applyRevHypothesis(hyp);
      ZYG_HOOK=z=>pwPhenotype(hyp,z); /* 图解表型 */
      const combos=revParentCandidates(hyp);
      for(const c of combos){

        const P1={all:c.p1,cyto:{},sex:'F'},P2={all:c.p2,cyto:{},sex:'M'};
        if(g1obs.length){
          const eg=makeGametes(P1,'F'),sp=makeGametes(P2,'M');
          const r=doCross(eg.list,sp.list);
          if(!obsMatch(r.zygs,g1obs[0]))continue;
        }
        const gens=forwardChain(P1,P2,rv.firstMode,N,nextMode);
        let ok=true;
        for(const o of obs){
          if(!obsMatch(gens[o.gen-1].pop,o)){ok=false;break}
        }
        if(ok)matches.push({p1:P1,p2:P2,hyp});

    }
    ZYG_HOOK=null;

    const m0=matches[0];

    applyRevHypothesis(hyp);

    for(const c of combos){

      const P1={all:c.p1,cyto:{},sex:'F'},P2={all:c.p2,cyto:{},sex:'M'};

        const eg=makeGametes(P1,'F'),sp=makeGametes(P2,'M');
        const r=doCross(eg.list,sp.list);
        if(!obsMatch(r.zygs,g1obs[0]))continue;
      }
      const gens=forwardChain(P1,P2,rv.firstMode,N,nextMode);
      let ok=true;
      for(const o of obs){
        if(!obsMatch(gens[o.gen-1].pop,o)){ok=false;break}
      }
      if(ok)matches.push({p1:P1,p2:P2,hyp});
      if(matches.length>=60)break outer;
    }
  }
  /* 恢复原状态（注意：S 已被替换为克隆，须重新取 S.rev） */
  S=SAVED;
  DOM_FLIP=new Set();
  rebuildLoci();
  S.rev.result={matches,tried,obs,N};revStale=false;
  if(!matches.length){
    lastResult=null;
    renderDiagram();
    note('尝试了 '+tried+' 种组合假设（含传递方式'+(rv.trySex?'、伴性':'')+(rv.tryLethal?'、致死':'')+(rv.tryInter?'、互作':'')+(rv.domUnknown?'、显隐性互换':'')+'），均无法匹配所给比例。');

  }
  const m0=matches[0];
  const nm0=m0.hyp.inh.some(x=>x!=='auto')&&rv.nextMode==='self'?'free':rv.nextMode;
  applyRevHypothesis(m0.hyp);
  lastResult={gens:forwardChain(m0.p1,m0.p2,rv.firstMode,N,nm0),p1:m0.p1,p2:m0.p2,mode:rv.firstMode,hyp:m0.hyp};
  S=SAVED;DOM_FLIP=new Set();rebuildLoci();
  renderDiagram();

function withRevHyp(fn){
  if(!(lastResult&&lastResult.hyp)){fn();return}
  const SAVED=cloneState();
  applyRevHypothesis(lastResult.hyp);
  if(lastResult.hyp.inter==='pw')ZYG_HOOK=z=>pwPhenotype(lastResult.hyp,z);
  try{fn()}finally{ZYG_HOOK=null;S=SAVED;DOM_FLIP=new Set();rebuildLoci()}
}
function hypDesc(m){
  const parts=[];
  m.hyp.genes.forEach((g,i)=>{
    const inh=m.hyp.inh[i];
    const way=inh==='auto'?'常染色体':inh==='X'?'伴X':inh==='Y'?'伴Y（限♂）':'X/Y同源区段';
    let s=g.letter+'：'+way;
    if(m.hyp.flip.includes(i))s+='，'+g.letter.toLowerCase()+' 对 '+g.letter+' 显性';
    if(m.hyp.let[i]==='domHom')s+='，'+g.letter+g.letter+' 致死';
    if(m.hyp.let[i]==='recHom')s+='，'+g.letter.toLowerCase()+g.letter.toLowerCase()+' 致死';
    parts.push(s);
  });
  if(m.hyp.inter==='pw'){
    /* 图解模式：按用户画的通路图描述 */
    const pw=m.hyp.pw;
    const nodeById=id=>pw.nodes.find(n=>n.id===id);
    const rx=(pw.reactions||[]).filter(r=>r.gene).map(r=>{
      const a=nodeById(r.from),b=nodeById(r.to);
      return r.gene+'基因显性时：'+(a?a.name:'?')+' → '+(b?b.name:'?');
    });
    const ix=(pw.inhibitions||[]).map(ib=>ib.gene+'基因产物缺失时抑制'+ib.targetGene+'基因的作用');
    parts.push('通路图：'+rx.join('；')+(ix.length?'；'+ix.join('；'):'')+'；表型=物质转化推进到的最远物质');
    return parts.join('；');
  }
  if(m.hyp.inter&&m.hyp.inter!=='none'){
    const nm={complement:'互补(A_B_↔其一显)',recessiveEpi:'隐性上位',dominantEpi:'显性上位',inhibitor:'抑制',duplicate:'重叠',additive:'积加'}[m.hyp.inter]||m.hyp.inter;
    const GA=m.hyp.genes[m.hyp.swap?1:0].letter,GB=m.hyp.genes[m.hyp.swap?0:1].letter;
    let s=GA+' 与 '+GB+' '+nm+'互作';
    if(m.hyp.assign&&m.hyp.assign.length){
      const slotDesc={complement:['A_B_','任一隐性纯合'],recessiveEpi:['A_B_','一方显+另一方隐纯','上位纯合'],dominantEpi:['上位显性_','下位显性_','双隐'],inhibitor:['被抑制类','仅下位显'],duplicate:['任一显性','双隐'],additive:['双显','单显','双隐']}[m.hyp.inter]||[];
      const pairs=m.hyp.assign.map((a,i)=>(slotDesc[i]||('槽'+(i+1)))+'='+a).join('，');
      s+='（'+pairs+'）';
    }
    parts.push(s);
  }else if(m.hyp.assign&&m.hyp.assign.length===2){
    parts.push('表型分配：'+m.hyp.genes[0].letter+'_ → '+m.hyp.assign[0]+'，'+m.hyp.genes[0].letter.toLowerCase()+m.hyp.genes[0].letter.toLowerCase()+' → '+m.hyp.assign[1]);
  }
  return parts.join('；');
}

/* ================= 遗传计算引擎 ================= */
function rDiv(a,b){return R(a.n*b.d,a.d*b.n)}
function condMatch(c,allMap){
  const arr=(allMap&&allMap[c.locus])||[];
  const has=arr.includes(c.allele);
  if(c.type==='has')return has;
  if(c.type==='nothas')return!has;
  if(c.type==='hom')return arr.length>=2&&arr.every(x=>x===c.allele);
  if(c.type==='het')return has&&arr.some(x=>x!==c.allele);
  return false;
}
function buildUnits(){
  const units=[];
  ['simple','multi'].forEach(g=>{
    const ch=S.chrom[g];
    const ls=groupLoci(g).filter(l=>!(l.group==='simple'&&l.def.inherit!=='auto'));
    const placedIds=new Set();
    for(let p=0;p<ch.pairs;p++){
      const pl=ch.placed.filter(x=>x.pair===p&&x.col!=null&&x.sym!=null&&ls.some(l=>l.id===x.locus)).sort((a,b)=>a.slot-b.slot);
      if(!pl.length)continue;
      const seen=new Set(),loci=[];
      pl.forEach(x=>{if(!seen.has(x.locus)){seen.add(x.locus);loci.push(x.locus)}});
      const placedByCol={};
      pl.forEach(x=>{
        if(!placedByCol[x.locus])placedByCol[x.locus]={};
        if(placedByCol[x.locus][x.col]==null)placedByCol[x.locus][x.col]=x.sym;
      });
      loci.forEach(id=>placedIds.add(id));
      const rec=[];
      for(let k=0;k<loci.length-1;k++){
        const v=(ch.rec[p]&&ch.rec[p][k]!=null&&ch.rec[p][k]!=='')?ch.rec[p][k]:50;
        rec.push(pctIn(v));
      }
      units.push({kind:'auto',group:g,pair:p,loci,rec,placedByCol,ploidy:ch.ploidy[p]||2,triMode:ch.triMode||'indep',nullG:ch.nullG||'dead'});
    }
    ls.forEach(l=>{
      if(!placedIds.has(l.id))units.push({kind:'auto',group:g,pair:-1,loci:[l.id],rec:[],ploidy:2,triMode:'indep',nullG:'dead'});
    });
  });
  if(S.sexSystem!=='none'){
    units.push({kind:'sex',
      xl:LOC.filter(l=>l.group==='simple'&&(l.def.inherit==='X'||l.def.inherit==='both')).map(l=>l.id),
      yl:LOC.filter(l=>l.group==='simple'&&(l.def.inherit==='Y'||l.def.inherit==='both')).map(l=>l.id)});
  }
  return units;
}
/* 相位解析：按图中各同源染色体上放置的等位基因重排亲本等位顺序（构成相引/相斥） */
function phasedAlleleArr(u,locusId,parent){
  const arr=((parent.all[locusId]||[]).filter(x=>x!=null));
  const byCol=u.placedByCol&&u.placedByCol[locusId];
  if(!byCol||!arr.length)return arr;
  const n=Math.max(arr.length,Object.keys(byCol).reduce((a,c)=>Math.max(a,+c+1),0));
  const out=new Array(Math.max(arr.length,1)).fill(null);
  const used=new Set();
  for(let c=0;c<arr.length;c++){
    const want=byCol[c];
    if(want!=null){
      const idx=arr.findIndex((a,i)=>a===want&&!used.has(i));
      if(idx>=0){out[c]=want;used.add(idx)}
    }
  }
  let j=0;
  for(let c=0;c<arr.length;c++){
    if(out[c]==null){
      while(j<arr.length&&used.has(j))j++;
      if(j<arr.length){out[c]=arr[j];used.add(j)}
    }
  }
  return out.map((x,i)=>x==null?arr[i]:x);
}
/* 二倍体连锁单元：路径法（相邻区间独立交换，无干涉近似） */
function autoGametes2(u,parent){
  const loci=u.loci,k=loci.length,out=[];
  if(k>14)return out;
  const phased=loci.map(id=>phasedAlleleArr(u,id,parent));
  const h0=phased.map(a=>a[0]!=null?a[0]:null);
  const h1=phased.map(a=>a[1]!=null?a[1]:null);
  for(let mask=0;mask<(1<<k);mask++){
    const hap={};let p=R(1,2);
    for(let i=0;i<k;i++){
      const bit=(mask>>i)&1;
      hap[loci[i]]=bit?[h1[i]]:[h0[i]];
      if(i>0){
        const r=u.rec[i-1];
        const prev=(mask>>(i-1))&1;
        p=rMul(p,bit===prev?rSub(rOne,r):r);
      }
    }
    out.push({hap,p});
  }
  return out;
}
/* 多拷贝（三体/四体）单元 */
function autoGametesMulti(u,parent){
  const loci=u.loci,m=u.ploidy;
  const phased=loci.map(id=>phasedAlleleArr(u,id,parent));
  const strands=[];
  for(let c=0;c<m;c++)strands.push(phased.map(a=>(a[c]!=null)?a[c]:null));
  const seen=new Map();
  function add(idxs,p){
    const hap={};
    loci.forEach((id,i)=>{hap[id]=idxs.map(j=>strands[j][i]).filter(x=>x!=null)});
    const key=JSON.stringify(hap);
    const e=seen.get(key);
    if(e)e.p=rAdd(e.p,p);else seen.set(key,{hap,p});
  }
  if(u.triMode==='to21'){
    const hi=Math.ceil(m/2),lo=Math.floor(m/2),subs=[];
    for(let mask=0;mask<(1<<m);mask++){
      const idxs=[];for(let j=0;j<m;j++)if(mask&(1<<j))idxs.push(j);
      if(idxs.length===hi||idxs.length===lo)subs.push(idxs);
    }
    subs.forEach(sb=>add(sb,R(1,subs.length)));
  }else{
    const kept=[];
    for(let mask=0;mask<(1<<m);mask++){
      const idxs=[];for(let j=0;j<m;j++)if(mask&(1<<j))idxs.push(j);
      if(!idxs.length&&u.nullG==='dead')continue;
      kept.push(idxs);
    }
    const w=R(1,kept.length);
    kept.forEach(idxs=>add(idxs,w));
  }
  return [...seen.values()];
}
/* 性染色体单元 */
function sexGametes(u,parent,role){
  const isHet=(S.sexSystem==='XY')?(role==='M'):(role==='F');
  const ids=[...new Set(u.xl.concat(u.yl))];
  function mk(type,idx){
    const al={};
    ids.forEach(id=>{
      const inh=locusById(id).def.inherit;
      const a=parent.all[id]||[];
      if(inh==='X')al[id]=((!isHet||idx===0)&&a[idx]!=null)?a[idx]:null;
      else if(inh==='Y')al[id]=((isHet&&idx===1)&&a[0]!=null)?a[0]:null;
      else al[id]=(a[idx]!=null)?a[idx]:null;
    });
    return{type,al,p:R(1,2)};
  }
  let t1,t2;
  if(S.sexSystem==='XY'){t1='X';t2=isHet?'Y':'X'}
  else{t1='Z';t2=isHet?'W':'Z'}
  const s1=mk(t1,0),s2=mk(t2,1);
  return[s1,s2];
}
/* 生成某亲本某性别角色的全部配子 */
function makeGametes(parent,role){
  const notes=[];
  const units=buildUnits();
  let list=[{hap:{},sexType:null,sexAll:null,cyto:(role==='F'&&parent.cyto)?parent.cyto:null,mom:(role==='F')?parent:null,p:R(1)}];
  units.forEach(u=>{
    const next=[];
    if(u.kind==='sex'){
      const gs=sexGametes(u,parent,role);
      gs.forEach(g=>list.forEach(b=>next.push({hap:b.hap,sexType:g.type,sexAll:g.al,cyto:b.cyto,mom:b.mom,p:rMul(b.p,g.p)})));
    }else if(u.ploidy===2){
      if(u.loci.length>1){
        const rp=u.rec.map(x=>rPct(x)).join('%、');
        const nm=u.loci.map(id=>{const l=locusById(id);return l.group==='simple'?l.letter:l.def.letter}).join('—');
        notes.push('连锁：'+nm+' 位于同一对染色体，相邻交换值 '+rp+'% → 亲本型(不交换)各 (1-r)/2，重组型各 r/2');
      }
      const gs=autoGametes2(u,parent);
      gs.forEach(g=>list.forEach(b=>{
        const hap=Object.assign({},b.hap);
        for(const id in g.hap)hap[id]=g.hap[id];
        next.push({hap,sexType:b.sexType,sexAll:b.sexAll,cyto:b.cyto,mom:b.mom,p:rMul(b.p,g.p)});
      }));
    }else{
      const firstId=u.loci[0];
      const cnt=(parent.all[firstId]||[]).filter(x=>x!=null).length;
      const m=(cnt>=1)?cnt:u.ploidy;
      if(m===2){
        const gs=autoGametes2(u,parent);
        gs.forEach(g=>list.forEach(b=>{
          const hap=Object.assign({},b.hap);
          for(const id in g.hap)hap[id]=g.hap[id];
          next.push({hap,sexType:b.sexType,sexAll:b.sexAll,cyto:b.cyto,mom:b.mom,p:rMul(b.p,g.p)});
        }));
      }else{
        notes.push('多拷贝染色体（本亲本 '+m+' 条）按"'+(u.triMode==='to21'?'n:1 交替式':'独立分配')+'"产生配子'+(u.triMode!=='to21'&&u.nullG==='dead'?'，进入0条的配子视为致死并归一化':''));
        const gs=autoGametesMulti(Object.assign({},u,{ploidy:m}),parent);
        gs.forEach(g=>list.forEach(b=>{
          const hap=Object.assign({},b.hap);
          for(const id in g.hap)hap[id]=g.hap[id];
          next.push({hap,sexType:b.sexType,sexAll:b.sexAll,cyto:b.cyto,mom:b.mom,p:rMul(b.p,g.p)});
        }));
      }
    }
    list=next;
  });
  const merged=new Map();
  list.forEach(g=>{
    const key=JSON.stringify([g.hap,g.sexType,g.sexAll]);
    const e=merged.get(key);
    if(e)e.p=rAdd(e.p,g.p);else merged.set(key,{g,p:g.p});
  });
  let arr=[...merged.values()];
  if(S.gLethal.enabled&&S.gLethal.rules.length){
    let anyDead=false;
    arr.forEach(e=>{
      let surv=R(1);
      S.gLethal.rules.forEach(rule=>{
        if(!rule.conds.length)return;
        const okSex=rule.sex==='both'||rule.sex==='bothdiff'||(rule.sex==='male'&&role==='M')||(rule.sex==='female'&&role==='F');
        if(!okSex)return;
        if(!rule.conds.every(c=>condMatch(c,e.g.hap)))return;
        const rate=rule.sex==='bothdiff'?pctIn(role==='M'?rule.rateM:rule.rateF):pctIn(rule.rate);
        surv=rMul(surv,rSub(rOne,rate));
      });
      if(!rEq(surv,rOne)){anyDead=true;e.surv=surv}
      e.p=rMul(e.p,surv);
    });
    if(anyDead){
      const tot=arr.reduce((a,e)=>rAdd(a,e.p),rZero);
      if(!rIs0(tot)){
        arr.forEach(e=>e.pn=rDiv(e.p,tot));
        notes.push('配子致死生效：'+(role==='M'?'雄':'雌')+'配子中部分类型按死亡率失活，存活配子概率重新归一化（合计仍为 1）');
      }else arr.forEach(e=>e.pn=rZero);
    }else arr.forEach(e=>e.pn=e.p);
  }else arr.forEach(e=>e.pn=e.p);
  return{list:arr,notes};
}
function combineZygote(eg,sp){
  const z={all:{},sex:null,cyto:eg.cyto?Object.assign({},eg.cyto):{},mother:eg.mom||null};
  const ids=new Set(Object.keys(eg.hap).concat(Object.keys(sp.hap)));
  ids.forEach(id=>{z.all[id]=(eg.hap[id]||[]).concat(sp.hap[id]||[])});
  if(S.sexSystem!=='none'){
    const ids2=new Set(Object.keys(eg.sexAll||{}).concat(Object.keys(sp.sexAll||{})));
    ids2.forEach(id=>{
      const a=[];
      if(eg.sexAll&&eg.sexAll[id]!=null)a.push(eg.sexAll[id]);
      if(sp.sexAll&&sp.sexAll[id]!=null)a.push(sp.sexAll[id]);
      z.all[id]=a;
    });
    if(S.sexSystem==='XY')z.sex=(sp.sexType==='Y')?'M':'F';
    else z.sex=(eg.sexType==='W')?'F':'M';
  }
  return z;
}
function sortAlleles(l,arr){return arr.slice().sort((a,b)=>alleleSyms(l).indexOf(a)-alleleSyms(l).indexOf(b))}
function locusSortKey(id){const m=/^([a-z]+)(\d+)$/.exec(id);return m?(m[1]+String(+m[2]).padStart(4,'0')):id}
/* X/Y(Z/W)同源区段的异配性别：等位顺序有意义（[X等位,Y等位]），不能排序合并——XᴮYᵇ 与 XᵇYᴮ 是不同基因型 */
function xyOrdered(l,arr,z){
  return l&&l.group==='simple'&&S.sexSystem!=='none'&&l.def.inherit==='both'
    &&arr&&arr.length===2&&z&&z.sex
    &&((S.sexSystem==='XY'&&z.sex==='M')||(S.sexSystem==='ZW'&&z.sex==='F'));
}
function zKey(z){
  const all={};
  Object.keys(z.all).sort((a,b)=>locusSortKey(a)<locusSortKey(b)?-1:locusSortKey(a)>locusSortKey(b)?1:0).forEach(id=>{const l=locusById(id);all[id]=l?(xyOrdered(l,z.all[id],z)?z.all[id].slice():sortAlleles(l,z.all[id])):z.all[id]});
  return JSON.stringify([all,z.sex,z.cyto||{},z.barrForce==null?-1:z.barrForce]);
}
function doCross(eggs,sperm){
  const notes=[];
  if(eggs.length*sperm.length>300000)notes.push('⚠ 配子组合数较大，计算可能稍慢。');
  const map=new Map();
  eggs.forEach(e=>sperm.forEach(s=>{
    const p=rMul(e.pn,s.pn);
    if(rIs0(p))return;
    const z=combineZygote(e.g,s.g);
    const k=zKey(z);
    const ex=map.get(k);
    if(ex)ex.p=rAdd(ex.p,p);else map.set(k,{z,p,preP:p});
  }));
  let deadFrac=rZero;
  if(S.zLethal.enabled&&S.zLethal.rules.length){
    map.forEach(v=>{
      let surv=R(1);
      S.zLethal.rules.forEach(rule=>{
        if(rule.conds.length&&rule.conds.every(c=>condMatch(c,v.z.all)))
          surv=rMul(surv,rSub(rOne,pctIn(rule.rate)));
      });
      v.dead=!rEq(surv,rOne);
      v.p=rMul(v.p,surv);
    });
    const before=[...map.values()].reduce((a,v)=>rAdd(a,v.preP),rZero);
    const after=[...map.values()].reduce((a,v)=>rAdd(a,v.p),rZero);
    if(!rIs0(before)){
      deadFrac=rSub(rOne,rDiv(after,before));
      if(!rIs0(deadFrac))notes.push('合子致死：死亡合计 '+rPct(deadFrac)+'，存活 '+rPct(rSub(rOne,deadFrac))+'；后代比例按存活个体归一化');
    }
  }
  let tot=rZero;map.forEach(v=>tot=rAdd(tot,v.p));
  const zygs=[];
  map.forEach(v=>{if(!rIs0(v.p)){v.pn=rDiv(v.p,tot);zygs.push(v)}});
  const deadList=[...map.values()].filter(v=>v.dead&&rIs0(v.p));
  return{zygs:splitBarr(zygs),raw:[...map.values()],deadFrac,deadList,notes};
}
function popGametePool(pop,role){
  const pool=new Map();
  pop.forEach(item=>{
    const gs=makeGametes(item.z,role).list;
    gs.forEach(g=>{
      const key=JSON.stringify([g.g.hap,g.g.sexType,g.g.sexAll]);
      const e=pool.get(key);
      if(e)e.p=rAdd(e.p,rMul(item.p,g.pn));
      else pool.set(key,{g:g.g,p:rMul(item.p,g.pn)});
    });
  });
  return[...pool.values()].map(e=>({g:e.g,pn:e.p}));
}
/* ---------- 表型判定 ---------- */
/* 巴氏小体：确定固缩失活的是哪条 X（返回 0/1），null 表示随机失活。
   机制：XX 中必有且仅有一条 X 失活（每条各 50%）；若"促进X固缩"互作基因显性，则携带它的那条 X 优先失活 */
function barrInactIdx(z){
  if(!S.barr)return null;
  if(!z||z.sex!=='F')return null; /* 巴氏小体仅雌性 XX：雄性唯一 X 不失活 */
  const it=S.inter;
  if(it.enabled&&it.type==='xInact'&&it.locusA){
    const rate=it.xInactRate==null?100:+it.xInactRate;
    if(rate<=0)return null; /* 固缩率 0% = 不促进，回到随机失活 */
    const B=locusById(it.locusA);
    if(B&&B.group==='simple'&&B.def.inherit==='X'){
      const arr=z.all[B.id]||[];
      if(arr.length===2&&arr[0]!==arr[1]){
        const domSym=DOM_FLIP.has(B.id)?alleleSyms(B)[1]:alleleSyms(B)[0];
        const d0=arr[0]===domSym,d1=arr[1]===domSym;
        if(d0&&!d1)return 0;
        if(d1&&!d0)return 1;
      }
    }
  }
  return null;
}
/* 部分固缩率拆分：杂合雌性在"固缩率提升至 P%"下按概率分裂为两个确定表型的虚拟个体。
   显性所在 X 失活概率 = P + (1-P)/2（P% 提升 + 剩余随机的一半），另一条 = (1-P)/2。 */
function splitBarr(pop){
  if(!S.barr||S.sexSystem!=='XY'||!pop||!pop.length)return pop;
  const it=S.inter;
  if(!(it.enabled&&it.type==='xInact'&&it.locusA))return pop;
  const B=locusById(it.locusA);
  if(!B||B.group!=='simple'||B.def.inherit!=='X')return pop;
  const rate=it.xInactRate==null?100:Math.max(0,Math.min(100,+it.xInactRate||0));
  if(rate<=0)return pop; /* 0% = 不促进，按随机失活（嵌合体）处理 */
  const r=pctIn(rate);
  const qDom=rAdd(r,rMul(rSub(rOne,r),R(1,2))); /* 显性所在X失活概率 */
  const qRec=rMul(rSub(rOne,r),R(1,2));          /* 另一条X失活概率 */
  const domSym=DOM_FLIP.has(B.id)?alleleSyms(B)[1]:alleleSyms(B)[0];
  const out=[];
  let split=false;
  pop.forEach(v=>{
    const arr=v.z.all[B.id]||[];
    if(v.z.sex==='F'&&arr.length===2&&arr[0]!==arr[1]){
      const d0=arr[0]===domSym,d1=arr[1]===domSym;
      if(d0!==d1){
        split=true;
        const di=d0?0:1;
        const base=v.p!=null?v.p:v.pn;
        const zA=Object.assign({},v.z,{barrForce:di}); /* 显性所在X固缩 */
        out.push({z:zA,p:rMul(base,qDom),pn:rMul(v.pn,qDom)});
        if(!rIs0(qRec)){
          const zB=Object.assign({},v.z,{barrForce:1-di});
          out.push({z:zB,p:rMul(base,qRec),pn:rMul(v.pn,qRec)});
        }
        return;
      }
    }
    out.push(v);
  });
  return split?out:pop;
}
function locusPhen(l,alleles,z){
  if(!alleles||!alleles.length)return null;
  if(l.group==='multi'){
    /* 等级框模型：从最高等级框向下找第一个命中的框；
       同框内携带多个不同等位 → 共显（同时表现）；否则表现该等位性状 */
    normMulti(l.def);
    for(const tier of l.def.tiers){
      const hit=tier.alleles.filter(a=>alleles.includes(a.sym));
      if(!hit.length)continue;
      if(hit.length>1)return hit.map(h=>h.trait).join(' 与 ')+'（共显）';
      return hit[0].trait;
    }
    return alleles[0];
  }
  const syms=alleleSyms(l);
  let dom=syms[0],rec=syms[1];
  /* 反推"显隐性未知"时支持翻转：小写对大写显性 */
  if(DOM_FLIP.has(l.id)&&l.def.mode==='complete'&&l.group==='simple'){dom=syms[1];rec=syms[0]}
  const hasDom=alleles.includes(dom);
  const allRec=alleles.every(x=>x===rec);
  const het=alleles.length===2&&alleles[0]!==alleles[1];
  if(S.sexSystem!=='none'&&l.def.inherit!=='auto'){
    const isHet=(S.sexSystem==='XY'&&z&&z.sex==='M')||(S.sexSystem==='ZW'&&z&&z.sex==='F');
    if(isHet&&alleles.length===1)return alleles[0]===dom?l.def.dom:l.def.rec;
    if(S.barr&&S.sexSystem==='XY'&&z&&z.sex==='F'&&l.def.inherit!=='Y'&&het){
      let idx=z.barrForce!=null?z.barrForce:barrInactIdx(z); /* 概率拆分后的个体带确定失活条 */
      if(idx!=null){
        /* 偏向失活：该条 X 固缩，表型由另一条决定 */
        const live=alleles[1-idx];
        return live===dom?l.def.dom:l.def.rec;
      }
      return'嵌合体：'+l.def.dom+' / '+l.def.rec+'（约各 1/2）';
    }
  }
  if(l.def.mode==='incomplete'){
    if(allRec)return l.def.rec;
    if(het)return l.def.mid||'中间类型';
    return l.def.dom;
  }
  if(l.def.mode==='codominant'){
    if(allRec)return l.def.rec;
    if(het)return l.def.dom+'与'+l.def.rec+'共显';
    return l.def.dom;
  }
  return hasDom?l.def.dom:l.def.rec;
}
function zygPhenotype(z){
  if(ZYG_HOOK)return ZYG_HOOK(z); /* 图解模式：表型由通路图假设决定 */
  const bits=[];
  let interText=null;
  const involved=new Set();
  const it=S.inter;
  const hasDom=l=>{const a=z.all[l.id]||[];return a.includes(alleleSyms(l)[0])};
  if(it.enabled){
    if(['complement','recessiveEpi','dominantEpi','inhibitor','duplicate','additive'].includes(it.type)){
      const A=locusById(it.locusA),B=locusById(it.locusB);
      if(A&&B&&(z.all[A.id]||[]).length&&(z.all[B.id]||[]).length){
        const dA=hasDom(A),dB=hasDom(B);
        involved.add(A.id);involved.add(B.id);
        interText={
          complement:(dA&&dB)?it.traits[0]:it.traits[1],
          recessiveEpi:(dA&&dB)?it.traits[0]:(dA?it.traits[1]:it.traits[2]),
          dominantEpi:dA?it.traits[0]:(dB?it.traits[1]:it.traits[2]),
          inhibitor:(!dA&&dB)?it.traits[1]:it.traits[0],
          duplicate:(dA||dB)?it.traits[0]:it.traits[1],

      if(it.pgVal){
        const base=it.pgBase==null?150:it.pgBase,inc=it.pgInc==null?5:it.pgInc;
        const val=Math.round((base+n*inc)*1000)/1000;
        interText=(it.pgName||'表型')+' '+val+(it.pgUnit||'')+'（'+n+' 个显性，第 '+n+' 级）';
      }else interText='含 '+n+' 个显性等位基因（第 '+n+' 级）';
    }else if(it.type==='pathway'){

        const st=pw.steps[k],l=locusById(st.locus);
        const func=l&&hasDom(l);
        const supL=pw.sup?locusById(pw.sup):null;
        const supOn=supL&&hasDom(supL)&&(pw.supStep===k);
        if(!func||supOn){blockedAt=k;break}
        involved.add(st.locus);
      }
      if(blockedAt>=0){
        const st=pw.steps[blockedAt];
        interText=st.blocked||('第'+(blockedAt+1)+'步受阻');
        involved.add(st.locus);
      }else interText=pw.final||'最终产物';
      pw.steps.forEach(st=>involved.add(st.locus));
      if(pw.sup){involved.add(pw.sup);}
    }else if(it.type==='custom'){
      const cl=it.customLoci||[];
      if(cl.length&&cl.every(id=>(z.all[id]||[]).length)){
        const key=cl.map(id=>{const l=locusById(id);return id+'='+(hasDom(l)?'D':'r')}).join(',');
        interText=it.custom[key]||'（未命名表型）';
        cl.forEach(id=>involved.add(id));
      }
    }
  }
  LOC.forEach(l=>{
    if(l.group==='cyto'){
      const v=z.cyto&&z.cyto[l.id];
      bits.push(traitOf(l,v)||(l.def.letter+'('+v+')'));
      return;
    }
    if(involved.has(l.id))return;
    let alleles=z.all[l.id]||[];
    if(l.def&&l.def.maternal&&z.mother&&z.mother.all&&z.mother.all[l.id]&&z.mother.all[l.id].length)
      alleles=z.mother.all[l.id];
    const ph=locusPhen(l,alleles,z);
    if(ph!=null)bits.push(ph);
  });
  if(interText)bits.unshift(interText);
  let txt=bits.join('、');
  if(S.sexSystem!=='none'&&z&&z.sex)txt+=(z.sex==='M'?'（♂）':'（♀）');
  return txt;
}
function genoHtml(z){
  const parts=[];
  LOC.forEach(l=>{
    if(l.group==='cyto')return;
    const a=z.all[l.id];
    if(a&&a.length===0){parts.push('O');return}/* 缺体：两条同源染色体均未进入，用 O 表示 */
    if(!a||!a.length)return;
    const sa=xyOrdered(l,a,z)?a.slice():sortAlleles(l,a); /* 同源区段异配性别保持 X前Y后 原序 */
    if(l.group==='simple'&&S.sexSystem!=='none'&&l.def.inherit!=='auto'){
      const X=S.sexSystem==='XY'?'X':'Z',Y=S.sexSystem==='XY'?'Y':'W';
      const isHet=(S.sexSystem==='XY'&&z.sex==='M')||(S.sexSystem==='ZW'&&z.sex==='F');
      const inh=l.def.inherit;
      if(inh==='X')parts.push((a.length===2)?(X+'<sup>'+sa[0]+'</sup>'+X+'<sup>'+sa[1]+'</sup>'):(X+'<sup>'+sa[0]+'</sup>'+Y));
      else if(inh==='Y')parts.push((a.length===1)?(Y+'<sup>'+sa[0]+'</sup>'):(X+Y));
      else parts.push(isHet?(X+'<sup>'+sa[0]+'</sup>'+Y+'<sup>'+sa[1]+'</sup>'):(X+'<sup>'+sa[0]+'</sup>'+X+'<sup>'+sa[1]+'</sup>'));
      return;
    }
    parts.push(sa.join(''));
  });
  let s=parts.join(' ');
  if(z.cyto&&Object.keys(z.cyto).length){
    const cs=Object.keys(z.cyto).map(id=>{const l=locusById(id);return l.def.letter+'('+z.cyto[id]+')'}).join(' ');
    s+=' <span style="opacity:.55">[质:'+cs+']</span>';
  }
  if(S.sexSystem!=='none')s+=z.sex==='M'?' <small>♂</small>':' <small>♀</small>';
  return s||'—';
}
function gameteHtml(g){
  const parts=[];
  LOC.forEach(l=>{
    if(l.group==='cyto')return;
    const arr=g.hap[l.id];
    if(arr&&arr.length)parts.push(sortAlleles(l,arr).join(''));
    else if(arr&&arr.length===0)parts.push('O');/* 缺体配子：该染色体进入 0 条，用 O 表示 */
  });
  if(g.sexType)parts.push(g.sexType);
  let s=parts.join(' ');
  if(g.cyto&&Object.keys(g.cyto).length)s+='[质]';
  return s||'—';
}
/* ---------- 多代迭代 ---------- */
function selfPop(pop){
  /* 雌雄异体（性染色体系统）无自交：按群体内随机交配处理。
     生殖细胞中失活的 X 重新激活——巴氏小体不影响配子（失活发生在合子形成之后，每代重置），
     子代不会因此出现 O/缺失基因型 */
  if(S.sexSystem!=='none')return freePop(pop);
  const map=new Map();
  pop.forEach(({z,p})=>{
    const eg=makeGametes(z,'F'),sp=makeGametes(z,'M');
    const r=doCross(eg.list,sp.list);
    r.zygs.forEach(v=>{
      const k=zKey(v.z);
      const e=map.get(k);
      if(e)e.p=rAdd(e.p,rMul(p,v.pn));
      else map.set(k,{z:v.z,p:rMul(p,v.pn)});
    });
  });
  let tot=rZero;map.forEach(e=>tot=rAdd(tot,e.p));
  const out=[];map.forEach(e=>{e.pn=rDiv(e.p,tot);out.push(e)});
  return out;
}
function freePop(pop){
  let eggs,sperm;
  if(S.sexSystem==='none'){
    eggs=popGametePool(pop,'F');sperm=popGametePool(pop,'M');
  }else{
    eggs=popGametePool(pop.filter(x=>x.z.sex==='F'),'F');
    sperm=popGametePool(pop.filter(x=>x.z.sex==='M'),'M');
    if(!eggs.length||!sperm.length)return[];
  }
  return doCross(eggs,sperm).zygs;
}
function runCalculation(){
  rebuildLoci();
  const M=S.mating;
  if(!LOC.length){lastResult=null;renderDiagram();return}
  if(M.mode==='self'&&S.sexSystem!=='none'){toast('涉及性染色体遗传时请使用"杂交"模式');return}
  const gens=forwardChain(M.p1,M.p2,M.mode,S.generations,'self',M.ratio);
  lastResult={gens,p1:M.p1,p2:M.p2,mode:M.mode};
  renderDiagram();
}

function phenoSummary(pop){
  const m=new Map();
  pop.forEach(v=>{
    const t=zygPhenotype(v.z);
    const k=zKey(v.z);
    const e=m.get(t);
    if(e){e.p=rAdd(e.p,v.pn);e.pn=e.p;if(k<e.firstKey)e.firstKey=k}
    else m.set(t,{t,p:v.pn,pn:v.pn,firstKey:k});
  });
  return[...m.values()].sort((a,b)=>a.firstKey<b.firstKey?-1:a.firstKey>b.firstKey?1:0);
}
function genoSummary(pop){
  const m=new Map();
  pop.forEach(v=>{
    const k=zKey(v.z);
    const e=m.get(k);
    if(e){e.p=rAdd(e.p,v.pn);e.pn=e.p}else m.set(k,{z:v.z,p:v.pn,pn:v.pn});
  });
  return[...m.values()].sort((a,b)=>zKey(a.z)<zKey(b.z)?-1:zKey(a.z)>zKey(b.z)?1:0);
}
function ratioOf(sum){return ratioStr(sum.map(e=>e.p))}

function buildStepsText(g){
  const L=[];
  L.push('═══ '+g.name+' 计算过程 ═══');
  (g.notes||[]).forEach(n=>L.push('· '+n));
  if(g.eggs&&g.sperm){
    L.push('');
    L.push('【第1步】雌配子（由'+(lastResult.mode==='self'?'自交亲本':'母本 P♀')+'产生）：');
    g.eggs.forEach(e=>L.push('    '+gameteHtml(e.g)+'   概率 = '+rStr(e.pn)));
    L.push('【第2步】雄配子（由'+(lastResult.mode==='self'?'自交亲本':'父本 P♂')+'产生）：');
    g.sperm.forEach(e=>L.push('    '+gameteHtml(e.g)+'   概率 = '+rStr(e.pn)));
    L.push('');
    L.push('【第3步】受精：棋盘格法，每个子代 = 某♀配子 × 某♂配子，');
    L.push('    概率 = ♀配子概率 × ♂配子概率；相同基因型合并相加。');
  }
  const gs=genoSummary(g.pop);
  L.push('');
  L.push('【'+g.name+' 基因型】共 '+gs.length+' 种：');
  gs.slice(0,20).forEach(v=>L.push('    '+stripHtml(genoHtml(v.z))+'   '+rStr(v.pn)+'   → '+zygPhenotype(v.z)));
  if(gs.length>20)L.push('    …（共 '+gs.length+' 种，此处列前 20 种）');
  const ps=phenoSummary(g.pop);
  L.push('');
  L.push('【'+g.name+' 表型比】'+ratioOf(ps));
  ps.forEach(x=>L.push('    '+x.t+'：'+rStr(x.p)));
  if(g.raw){
    const dead=g.raw.filter(v=>v.dead);
    if(dead.length){
      L.push('');
      L.push('【致死基因型】');
      dead.slice(0,10).forEach(v=>L.push('    '+stripHtml(genoHtml(v.z))+'   致死前概率 '+rStr(v.preP)));
    }
  }
  return L.join('\n');
}
function individualChromSvg(z){
  const units=buildUnits();
  const infos=[];

    if(u.kind==='auto'&&u.loci.length){
      const m=u.ploidy,strands=[];
      for(let c=0;c<m;c++)strands.push(u.loci.map(id=>(z.all[id]&&z.all[id][c]!=null)?z.all[id][c]:'·'));
      infos.push({label:u.pair>=0?('第'+(u.pair+1)+'对'+(m>2?'（'+m+'条）':'')):'独立分配',loci:u.loci,strands,names:null});
    }else if(u.kind==='sex'){
      const ids=[...new Set(u.xl.concat(u.yl))];
      const isHet=(S.sexSystem==='XY'&&z.sex==='M')||(S.sexSystem==='ZW'&&z.sex==='F');
      function st(idx){
        return ids.map(id=>{
          const inh=locusById(id).def.inherit,a=z.all[id]||[];
          if(inh==='X')return((!isHet||idx===0)&&a[idx]!=null)?a[idx]:'·';
          if(inh==='Y')return((isHet&&idx===1)&&a[0]!=null)?a[0]:'·';
          return(a[idx]!=null)?a[idx]:'·';
        });
      }
      let t1,t2;
      if(S.sexSystem==='XY'){t1='X';t2=isHet?'Y':'X'}else{t1='Z';t2=isHet?'W':'Z'}
      if(ids.length)infos.push({label:'性染色体',loci:ids,strands:[st(0),st(1)],names:[t1,t2]});
      else infos.push({label:'性染色体',loci:[],strands:[[],[]],names:[t1,t2]});
    }
  });
  const wrap=el('div');
  const slotMax=Math.max(1,...infos.map(i=>Math.max(1,i.loci.length)));
  const H=26+slotMax*24;
  const colWs=infos.map(i=>Math.max(88,i.strands.length*20+52));
  const W=Math.max(190,infos.reduce((a,w)=>a+w+14,4));

  const mk=(t,a,txt)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e};
  let x=10;
  infos.forEach((info,ii)=>{
    const colW=colWs[ii],color=PAIR_COLORS[ii%PAIR_COLORS.length];
    const xc=x+colW/2,m=info.strands.length;
    for(let c=0;c<m;c++){
      const bx=xc-(m-1)*10+c*20;
      svg.append(mk('line',{x1:bx,y1:14,x2:bx,y2:14+H,stroke:color,'stroke-width':3,'stroke-linecap':'round',opacity:.9}));
      svg.append(mk('circle',{cx:bx,cy:14+H/2,r:2.5,fill:color}));
      const n=Math.max(1,info.loci.length);
      for(let k=0;k<n;k++){
        const y=14+(k+0.7)*H/n;
        svg.append(mk('line',{x1:bx-9,y1:y,x2:bx+9,y2:y,stroke:color,'stroke-width':1.3,opacity:.8}));
        /* 字母放在竖线左侧，紧贴竖线不重叠 */
        svg.append(mk('text',{x:bx-4,y:y+3.5,'text-anchor':'end','font-size':10,'font-weight':700,fill:color},info.strands[c][k]||'·'));
      }
      if(info.names)svg.append(mk('text',{x:bx,y:14+H+13,'text-anchor':'middle','font-size':11,'font-weight':700,fill:color},info.names[c]));
    }
    svg.append(mk('text',{x:xc,y:9,'text-anchor':'middle','font-size':10,fill:'currentColor',opacity:.7},info.label));
    x+=colW+14;
  });
  wrap.append(el('div',{class:'chromwrap'},svg));
  if(z.cyto&&Object.keys(z.cyto).length){
    const cs=Object.keys(z.cyto).map(id=>{const l=locusById(id);return l.def.letter+'：'+(traitOf(l,z.cyto[id])||z.cyto[id])}).join('；');
    wrap.append(el('div',{class:'hint'},'细胞质（母系遗传）：'+cs));

  const wrap=el('div');
  wrap.append(el('div',{class:'chromwrap'},svg));
  wrap.append(el('div',{class:'gamete-list',html:'各级比例 <b>'+ratioStr(gs.map(x=>x.p))+'</b>　（共 '+(gs.length)+' 级'+(it.pgVal?('，表型范围 '+((it.pgBase==null?150:it.pgBase))+(it.pgUnit||'')+' ~ '+((it.pgBase==null?150:it.pgBase)+total*(it.pgInc==null?5:it.pgInc))+(it.pgUnit||'')):'')+'）'}));
  return wrap;
}
function showGenDetail(name){
  if(!lastResult)return;
  if(lastResult.hyp){withRevHyp(()=>showGenDetailInner(name))}else showGenDetailInner(name);
}
function showGenDetailInner(name){
  if(!lastResult)return;
  const wrap=el('div');
  if(name==='P'){
    const ps=lastResult.mode==='self'?[lastResult.p1]:[lastResult.p1,lastResult.p2];
    ps.forEach((p,i)=>{
      const card=el('div',{class:'card'});
      card.append(el('div',{class:'chead'},lastResult.mode==='self'?'自交亲本':(i===0?'母本 ♀':'父本 ♂')));
      card.append(el('div',{class:'big',html:genoHtml(p)}));
      card.append(el('div',{class:'hint'},'性状：'+zygPhenotype(p)));
      wrap.append(card);
      wrap.append(individualChromSvg(p));
    });
    openModal('P 世代 · 亲本与染色体图解',wrap);return;
  }
  const g=lastResult.gens.find(x=>x.name===name);
  if(!g)return;
  wrap.append(el('h4',{class:'sec'},name+' · 计算过程（每步分行）'));
  wrap.append(el('div',{class:'steps'},buildStepsText(g)));
  wrap.append(el('h4',{class:'sec'},name+' · 染色体图解（代表个体）'));
  genoSummary(g.pop).slice(0,4).forEach(v=>{
    const card=el('div',{class:'card'});
    card.append(el('div',{class:'chead',html:genoHtml(v.z)+' <span class="hint">'+rStr(v.pn)+'</span>'}));
    card.append(individualChromSvg(v.z));
    wrap.append(card);
  });
  if(S.inter.enabled&&S.inter.type==='polygenic'&&S.inter.addLoci&&S.inter.addLoci.length){
    wrap.append(el('h4',{class:'sec'},name+' · 连续表型分布'));
    wrap.append(drawPolyChart(g.pop));
  }
  openModal(name+' 世代详情',wrap);
}
/* ================= 经典题型预设 ================= */
window.applyPreset=function(k){
  S=freshState();selectedChip=null;lastResult=null;
  rebuildLoci();
  if(k==='epi934'){
    S.simpleCount=2;
    S.simple[0]={letter:'A',dom:'黑色',rec:'棕色',mid:'中间',mode:'complete',inherit:'auto',maternal:false};
    S.simple[1]={letter:'B',dom:'有色',rec:'白化(上位)',mid:'中间',mode:'complete',inherit:'auto',maternal:false};
    S.inter={enabled:true,type:'recessiveEpi',locusA:'n0',locusB:'n1',traits:['黑色','棕色','白化',''],addLoci:[],pathway:{steps:[],final:'最终产物'},custom:{},customLoci:[]};
  }else if(k==='comp97'){
    S.simpleCount=2;
    S.simple[0]={letter:'C',dom:'酶1正常',rec:'酶1缺失',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.simple[1]={letter:'P',dom:'酶2正常',rec:'酶2缺失',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.inter={enabled:true,type:'complement',locusA:'n0',locusB:'n1',traits:['紫花','白花','',''],addLoci:[],pathway:{steps:[],final:'最终产物'},custom:{},customLoci:[]};
  }else if(k==='additive141'){
    S.simpleCount=2;
    S.simple[0]={letter:'A',dom:'一份效应',rec:'无效应',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.simple[1]={letter:'B',dom:'一份效应',rec:'无效应',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.inter={enabled:true,type:'polygenic',locusA:'',locusB:'',traits:['','','',''],addLoci:['n0','n1'],pathway:{steps:[],final:'最终产物'},custom:{},customLoci:[]};
  }else if(k==='polygen3'){
    S.simpleCount=3;
    ['A','B','C'].forEach((L,i)=>{S.simple[i]={letter:L,dom:'一份增效',rec:'无增效',mid:'',mode:'complete',inherit:'auto',maternal:false}});
    S.inter={enabled:true,type:'polygenic',locusA:'',locusB:'',traits:['','','',''],addLoci:['n0','n1','n2'],
      pgVal:true,pgName:'株高',pgUnit:'cm',pgBase:150,pgInc:5,
      pathway:{steps:[],final:'最终产物'},custom:{},customLoci:[]};
  }else if(k==='abo'){
    S.simpleCount=0;
    S.multiCount=1;
    S.multi[0]={letter:'I',tiers:[
      {cls:'dom',alleles:[{sym:'IA',trait:'A型血(有A抗原)'},{sym:'IB',trait:'B型血(有B抗原)'}]},
      {cls:'rec',alleles:[{sym:'i',trait:'O型血(无抗原)'}]}
    ]};
  }else if(k==='link'){
    S.simpleCount=2;
    S.simple[0]={letter:'A',dom:'显性性状1',rec:'隐性性状1',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.simple[1]={letter:'B',dom:'显性性状2',rec:'隐性性状2',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.chrom.simple.pairs=1;S.chrom.simple.pairsAuto=false;
    S.chrom.simple.placed=[{pair:0,col:0,slot:0,locus:'n0',sym:'A'},{pair:0,col:1,slot:0,locus:'n0',sym:'a'},{pair:0,col:0,slot:1,locus:'n1',sym:'B'},{pair:0,col:1,slot:1,locus:'n1',sym:'b'}];
    S.chrom.simple.rec=[[20]];
  }else if(k==='sexlink'){
    S.sexEnabled=true;S.sexSystem='XY';
    S.simpleCount=1;
    S.simple[0]={letter:'A',dom:'色觉正常',rec:'红绿色盲',mid:'',mode:'complete',inherit:'X',maternal:false};
  }else if(k==='cyto'){
    S.simpleCount=0;
    S.cytoCount=1;
    S.cyto[0]={letter:'L',variants:[{sym:'G',trait:'绿色枝条'},{sym:'W',trait:'白色枝条'},{sym:'M',trait:'花斑枝条'}]};
  }else if(k==='lethal'){
    S.simpleCount=1;
    S.simple[0]={letter:'A',dom:'黄鼠(纯合致死)',rec:'黑鼠',mid:'',mode:'complete',inherit:'auto',maternal:false};
    S.zLethal={enabled:true,rules:[{rate:100,conds:[{locus:'n0',allele:'A',type:'hom'}]}]};
  }
  rebuildLoci();
  S.mating.p1=defaultParent('F');
  S.mating.p2=defaultParent('M');
  if(k==='abo'){S.mating.p1.all={m0:['IA','i']};S.mating.p2.all={m0:['IB','i']}}
  if(k==='link'){S.mating.p1.all={n0:['A','a'],n1:['B','b']};S.mating.p2.all={n0:['a','a'],n1:['b','b']}}
  if(k==='sexlink'){S.mating.p1.all={n0:['A','a']};S.mating.p2.all={n0:['a']}}
  renderConfig();
  renderDiagram();
  switchTab('config');
  toast('已载入预设，可在右侧调整亲本后点击「开始计算」。');
};
/* ================= 总渲染与初始化 ================= */
function renderConfig(){
  rebuildLoci();
  const c=document.getElementById('configPanel');
  c.innerHTML='';
  c.append(helpPanel(),basicPanel(),simplePanel(),multiPanel(),cytoPanel(),linkagePanel(),lethalPanel('g'),lethalPanel('z'),interPanel(),presetPanel());
  renderRun();
  if(pendingScroll){
    const d=[...c.querySelectorAll('details.panel')].find(x=>x.querySelector('summary').textContent.indexOf(pendingScroll)>=0);
    if(d){d.open=true;PANEL_OPEN[d.querySelector('summary').textContent]=true;
      try{d.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}}
    pendingScroll=null;
  }
}
rebuildLoci();
renderConfig();
renderDiagram();
setTheme('light');
